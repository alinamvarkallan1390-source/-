name: Verify
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test && npm run build
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build backend/Nexora.csproj --configuration Release
      - name: Exercise API and bot flow
        run: |
          dotnet run --project backend/Nexora.csproj --configuration Release --no-build --urls http://127.0.0.1:5230 > /tmp/nexora.log 2>&1 &
          pid=$!
          trap 'cat /tmp/nexora.log; kill $pid || true' EXIT
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5230/api/health && break; sleep 1; done
          python3 tests/api_smoke.py
