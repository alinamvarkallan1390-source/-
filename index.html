<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه هوشمند خزانه و امضای دیجیتال ساختمان</title>
    
    <!-- Vazirmatn Persian Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Vazirmatn', 'Tahoma', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- React and ReactDOM CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel CDN for on-the-fly JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    
    <!-- jsPDF CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <!-- Lucide Icons CDN (via ES modules or simple UMD) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html {
            overflow-x: hidden;
            max-width: 100vw;
        }
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            user-select: none;
            overflow-x: hidden;
            max-width: 100vw;
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== MOBILE VIEWPORT FIX ===== */
        :root {
            --vh: 1vh;
        }
        .full-vh { height: calc(var(--vh, 1vh) * 100); min-height: calc(var(--vh, 1vh) * 100); }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.4); border-radius: 4px; }

        /* ===== AURORA BACKGROUND ===== */
        @keyframes auroraShift1 { 0%,100%{transform:translate(0,0) scale(1) rotate(0deg);} 33%{transform:translate(20px,-30px) scale(1.1) rotate(3deg);} 66%{transform:translate(-20px,20px) scale(0.95) rotate(-2deg);} }
        @keyframes auroraShift2 { 0%,100%{transform:translate(0,0) scale(1) rotate(0deg);} 33%{transform:translate(-20px,20px) scale(1.05) rotate(-4deg);} 66%{transform:translate(20px,-15px) scale(1.02) rotate(2deg);} }
        @keyframes auroraShift3 { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(15px,-20px) scale(1.1);} }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .bg-animated-mesh {
            background: linear-gradient(-45deg, #050515, #0d0b26, #140e36, #07061a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
        .aurora-blob-1 { animation: auroraShift1 18s infinite ease-in-out; filter: blur(90px); opacity: 0.25; }
        .aurora-blob-2 { animation: auroraShift2 22s infinite ease-in-out 2s; filter: blur(110px); opacity: 0.2; }
        .aurora-blob-3 { animation: auroraShift3 14s infinite ease-in-out 4s; filter: blur(70px); opacity: 0.15; }
        /* keep old names working */
        .blob-glowing-indigo { animation: auroraShift1 12s infinite ease-in-out; filter: blur(80px); opacity: 0.22; }
        .blob-glowing-purple { animation: auroraShift2 16s infinite ease-in-out 2s; filter: blur(90px); opacity: 0.18; }

        /* ===== NOISE GRAIN OVERLAY ===== */
        .noise-overlay::after {
            content: '';
            position: fixed; inset: 0;
            pointer-events: none; z-index: 1;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 150px;
        }

        /* ===== ENTRANCES ===== */
        @keyframes fadeInUp { from{opacity:0;transform:translateY(30px);} to{opacity:1;transform:translateY(0);} }
        @keyframes fadeInDown { from{opacity:0;transform:translateY(-20px);} to{opacity:1;transform:translateY(0);} }
        @keyframes zoomInSpring { from{opacity:0;transform:scale(0.92) translateY(15px);} to{opacity:1;transform:scale(1) translateY(0);} }
        @keyframes staggerIn { from{opacity:0;transform:translateY(20px) scale(0.97);} to{opacity:1;transform:translateY(0) scale(1);} }
        .animate-fade-in-up { animation: fadeInUp 0.7s cubic-bezier(0.16,1,0.3,1) both; }
        .animate-fade-in-down { animation: fadeInDown 0.5s cubic-bezier(0.16,1,0.3,1) both; }
        .animate-zoom-in-spring { animation: zoomInSpring 0.5s cubic-bezier(0.34,1.56,0.64,1) both; }
        .stagger-1 { animation: staggerIn 0.6s cubic-bezier(0.16,1,0.3,1) 0.05s both; }
        .stagger-2 { animation: staggerIn 0.6s cubic-bezier(0.16,1,0.3,1) 0.12s both; }
        .stagger-3 { animation: staggerIn 0.6s cubic-bezier(0.16,1,0.3,1) 0.19s both; }
        .stagger-4 { animation: staggerIn 0.6s cubic-bezier(0.16,1,0.3,1) 0.26s both; }

        /* ===== GLOW PULSE ===== */
        @keyframes glowPulse { 0%,100%{box-shadow:0 0 20px rgba(99,102,241,0.25),0 0 40px rgba(168,85,247,0.15);} 50%{box-shadow:0 0 35px rgba(99,102,241,0.45),0 0 60px rgba(168,85,247,0.3);} }
        .animate-glow-pulse { animation: glowPulse 3.5s infinite ease-in-out; }

        /* ===== SHIMMER BUTTON ===== */
        @keyframes shimmerSweep { 0%{transform:translateX(-100%) rotate(30deg);} 100%{transform:translateX(250%) rotate(30deg);} }
        .shimmer-btn { position:relative; overflow:hidden; }
        .shimmer-btn::after { content:''; position:absolute; top:-50%; left:-60%; width:30%; height:200%; background:linear-gradient(to right,rgba(255,255,255,0) 0%,rgba(255,255,255,0.3) 50%,rgba(255,255,255,0) 100%); transform:rotate(30deg); animation:shimmerSweep 4s infinite linear; }

        /* ===== RIPPLE EFFECT ===== */
        .ripple-btn { position:relative; overflow:hidden; }
        .ripple-btn .ripple-wave { position:absolute; border-radius:50%; background:rgba(255,255,255,0.3); transform:scale(0); animation:rippleAnim 0.6s linear; pointer-events:none; }
        @keyframes rippleAnim { to{transform:scale(4);opacity:0;} }

        /* ===== MAGNETIC BUTTON ===== */
        .magnetic-btn { transition: transform 0.2s cubic-bezier(0.23,1,0.32,1); }

        /* ===== COUNTER ANIMATION ===== */
        @keyframes countUp { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
        .counter-animate { animation: countUp 0.4s ease both; }

        /* ===== SPINNER ===== */
        @keyframes spinRing { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }
        @keyframes pulseLogo { 0%,100%{transform:scale(1);opacity:0.8;} 50%{transform:scale(1.12);opacity:1;filter:drop-shadow(0 0 15px rgba(99,102,241,0.8));} }
        .animate-spin-slow { animation: spinRing 3s linear infinite; }
        .animate-spin-reverse { animation: spinRing 1.5s linear infinite reverse; }
        .animate-pulse-logo { animation: pulseLogo 2s infinite ease-in-out; }

        /* ===== NEON DIVIDERS ===== */
        @keyframes neonDividerBeam { 0%{transform:scaleY(0);opacity:0;} 40%{transform:scaleY(1);opacity:1;filter:drop-shadow(0 0 20px #6366f1);} 100%{transform:scaleY(1);opacity:0.35;filter:drop-shadow(0 0 8px #6366f1);} }
        @keyframes neonDividerBeamHoriz { 0%{transform:scaleX(0);opacity:0;} 40%{transform:scaleX(1);opacity:1;filter:drop-shadow(0 0 20px #6366f1);} 100%{transform:scaleX(1);opacity:0.35;filter:drop-shadow(0 0 8px #6366f1);} }
        @keyframes slideInLeftSplit { from{transform:translateX(-100%);opacity:0;} to{transform:translateX(0);opacity:1;} }
        @keyframes slideInRightSplit { from{transform:translateX(100%);opacity:0;} to{transform:translateX(0);opacity:1;} }
        @keyframes slideInTopSplit { from{transform:translateY(-100%);opacity:0;} to{transform:translateY(0);opacity:1;} }
        @keyframes slideInBottomSplit { from{transform:translateY(100%);opacity:0;} to{transform:translateY(0);opacity:1;} }
        .animate-slide-left-split { animation: slideInLeftSplit 1.4s cubic-bezier(0.19,1,0.22,1) both; }
        .animate-slide-right-split { animation: slideInRightSplit 1.4s cubic-bezier(0.19,1,0.22,1) both; }
        .animate-slide-top-split { animation: slideInTopSplit 1.4s cubic-bezier(0.19,1,0.22,1) both; }
        .animate-slide-bottom-split { animation: slideInBottomSplit 1.4s cubic-bezier(0.19,1,0.22,1) both; }
        .animate-neon-divider { animation: neonDividerBeam 1.8s cubic-bezier(0.19,1,0.22,1) both 0.3s; }
        .animate-neon-divider-horiz { animation: neonDividerBeamHoriz 1.8s cubic-bezier(0.19,1,0.22,1) both 0.3s; }

        /* Blueprint grid */
        .blueprint-grid { background-image: radial-gradient(rgba(99,102,241,0.12) 1px,transparent 1px); background-size: 32px 32px; }

        /* Hologram */
        @keyframes hologramRotate { from{transform:rotateY(0deg) rotateX(15deg);} to{transform:rotateY(360deg) rotateX(15deg);} }
        .hologram-container { perspective: 1000px; }
        .hologram-3d { transform-style:preserve-3d; animation:hologramRotate 15s linear infinite; }

        /* ===== 3D TILT CARDS ===== */
        .tilt-card { transition: transform 0.15s ease, box-shadow 0.15s ease; transform-style: preserve-3d; }
        .tilt-card:hover { box-shadow: 0 30px 60px -15px rgba(99,102,241,0.3); }
        @media (max-width: 768px) {
            .tilt-card { transform: none !important; }
        }

        /* ===== FOCUS DIM EFFECT ===== */
        .focus-group:hover .focus-item { opacity: 0.45; transform: scale(0.98); transition: all 0.3s ease; }
        .focus-group:hover .focus-item:hover { opacity: 1; transform: scale(1); }
        .focus-item { transition: all 0.3s ease; }

        /* ===== CYBER GLOW CARD ===== */
        .cyber-glow-card { position:relative; background:rgba(10,8,30,0.85)!important; border-radius:32px; z-index:1; box-shadow:0 25px 50px -12px rgba(0,0,0,0.7); }
        .cyber-glow-card::before { content:''; position:absolute; top:-2px;left:-2px;right:-2px;bottom:-2px; background:linear-gradient(45deg,#6366f1,#a855f7,#06b6d4,#ff007f,#6366f1); background-size:400% 400%; z-index:-1; border-radius:34px; animation:gradientBG 8s linear infinite; filter:blur(4px); opacity:0.8; transition:all 0.3s ease; }
        .cyber-glow-card:hover::before { filter:blur(8px); opacity:1; }

        /* Cyber corners */
        .cyber-corner { position:absolute; width:12px; height:12px; border-color:#a855f7; border-style:solid; pointer-events:none; }
        .corner-tl { top:12px;left:12px;border-width:3px 0 0 3px; }
        .corner-tr { top:12px;right:12px;border-width:3px 3px 0 0; }
        .corner-bl { bottom:12px;left:12px;border-width:0 0 3px 3px; }
        .corner-br { bottom:12px;right:12px;border-width:0 3px 3px 0; }

        /* Scanning line */
        @keyframes scan { 0%{top:0%;} 50%{top:100%;} 100%{top:0%;} }
        .scanline { position:absolute; left:0; width:100%; height:6px; background:linear-gradient(to bottom,rgba(99,102,241,0),rgba(99,102,241,0.8) 50%,rgba(99,102,241,0)); animation:scan 5s linear infinite; z-index:5; pointer-events:none; }

        /* Cyber input underline */
        .cyber-input-wrap { position:relative; }
        .cyber-input-underline { position:absolute; bottom:0; left:50%; width:0; height:2px; background:linear-gradient(to right,#6366f1,#a855f7); transition:all 0.4s cubic-bezier(0.16,1,0.3,1); }
        input:focus~.cyber-input-underline,textarea:focus~.cyber-input-underline,select:focus~.cyber-input-underline { width:100%;left:0;filter:drop-shadow(0 0 8px #a855f7); }

        /* ===== HOVER LIFT ===== */
        .hover-lift-glow { transition: all 0.3s cubic-bezier(0.16,1,0.3,1); }
        .hover-lift-glow:hover { transform:translateY(-4px) scale(1.015); box-shadow:0 20px 40px -15px rgba(99,102,241,0.35); border-color:rgba(99,102,241,0.4)!important; }

        /* ===== RADAR ===== */
        @keyframes radarScan { 0%{transform:scale(0.8);opacity:0.8;} 100%{transform:scale(1.5);opacity:0;} }
        .radar-ring { position:absolute; border:2px solid rgba(99,102,241,0.4); border-radius:50%; animation:radarScan 3s infinite linear; }
        .radar-ring-delayed { animation-delay:1.5s; }

        /* Socket */
        .socket { box-shadow:-0.05em 0.1em 0.2em -0.2em white; background:light-dark(hsl(0 0% 90%),hsl(0 0% 0%)); position:relative; inset:0; }
        .socket-shadow { position:absolute; inset:0 0em; opacity:0; border-radius:inherit; box-shadow:0em 0.075em 0.1em 0em white; }

        /* ===== TOAST PROGRESS BAR ===== */
        @keyframes toastProgress { from{width:100%;} to{width:0%;} }
        .toast-progress { animation: toastProgress var(--toast-duration, 3s) linear forwards; }

        /* ===== SKELETON LOADING ===== */
        @keyframes skeletonShimmer { 0%{background-position:-200% 0;} 100%{background-position:200% 0;} }
        .skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(99,102,241,0.08) 50%, rgba(255,255,255,0.03) 75%); background-size:200% 100%; animation: skeletonShimmer 1.5s infinite; border-radius: 8px; }

        /* ===== NUMBER COUNTER ===== */
        @keyframes numberPop { 0%{transform:scale(0.8);opacity:0;} 60%{transform:scale(1.05);} 100%{transform:scale(1);opacity:1;} }
        .number-pop { animation: numberPop 0.5s cubic-bezier(0.34,1.56,0.64,1) both; }

        /* ===== HEARTBEAT LINE ===== */
        @keyframes heartbeatPulse { 0%,90%,100%{opacity:0.4;} 45%{opacity:1;filter:drop-shadow(0 0 6px #6366f1);} }
        .heartbeat-line { animation: heartbeatPulse 2s infinite; }

        /* ===== STATUS BAR ===== */
        @keyframes statusScroll { 0%{transform:translateX(0);} 100%{transform:translateX(-50%);} }
        .status-bar-inner { animation: statusScroll 20s linear infinite; white-space: nowrap; }

        /* ===== CONFETTI ===== */
        @keyframes confettiFall { 0%{transform:translateY(-10px) rotateZ(0deg);opacity:1;} 100%{transform:translateY(100vh) rotateZ(720deg);opacity:0;} }
        .confetti-piece { position:fixed; animation: confettiFall var(--fall-dur,2s) ease-in var(--fall-delay,0s) forwards; pointer-events:none; z-index:99999; }

        /* ===== SHAKE (error) ===== */
        @keyframes shakeInput { 0%,100%{transform:translateX(0);} 20%,60%{transform:translateX(-8px);} 40%,80%{transform:translateX(8px);} }
        .shake { animation: shakeInput 0.4s ease; }

        /* ===== PAGE WIPE TRANSITION ===== */
        @keyframes wipeIn { 0%{clip-path:inset(0 100% 0 0);} 100%{clip-path:inset(0 0% 0 0);} }
        .wipe-in { animation: wipeIn 0.4s cubic-bezier(0.16,1,0.3,1) both; }

        /* ===== FLOATING BADGE ===== */
        @keyframes badgeBounce { 0%,100%{transform:scale(1) translateY(0);} 50%{transform:scale(1.15) translateY(-3px);} }
        .badge-bounce { animation: badgeBounce 1s infinite; }

        /* ===== MOUSE PARTICLE TRAIL ===== */
        .mouse-particle { position:fixed; pointer-events:none; border-radius:50%; z-index:9999; animation:particleFade 0.8s ease forwards; }
        @keyframes particleFade { 0%{opacity:1;transform:scale(1);} 100%{opacity:0;transform:scale(0.1) translateY(-20px);} }

        /* ===== LOGIN PAGE ===== */
        #login-canvas { position:fixed; top:0;left:0; width:100%;height:100%; z-index:0; pointer-events:none; }
        .login-root { position:fixed; inset:0; z-index:1; display:flex; align-items:center; justify-content:center; overflow:hidden; padding: 16px; }
        
        @keyframes coreBreath { 0%,100%{transform:scale(1);filter:blur(0px);} 50%{transform:scale(1.08);filter:blur(1px);} }
        @keyframes panelReveal { 0%{opacity:0;transform:scale(0.6) translateY(40px);filter:blur(20px);} 60%{opacity:1;transform:scale(1.02) translateY(-3px);filter:blur(0px);} 100%{opacity:1;transform:scale(1) translateY(0);filter:blur(0px);} }
        @keyframes inputReveal { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
        @keyframes neonBorderPulse { 0%,100%{border-color:rgba(0,255,255,0.2);} 50%{border-color:rgba(0,200,255,0.5);} }
        @keyframes btnCharge { 0%{background-position:0% 50%;} 100%{background-position:300% 50%;} }
        @keyframes energyWave { 0%{left:-100%;} 100%{left:200%;} }
        @keyframes screenShake { 0%,100%{transform:translate(0);} 20%{transform:translate(-6px,3px);} 40%{transform:translate(6px,-3px);} 60%{transform:translate(-4px,4px);} 80%{transform:translate(4px,-2px);} }
        @keyframes glassReveal { 0%{opacity:0;} 30%{opacity:1;} 80%{opacity:0.8;} 100%{opacity:0;} }
        @keyframes fragmentFly { 0%{transform:translate(0,0) rotate(0deg) scale(1);opacity:1;} 100%{transform:var(--fly-x,200px) var(--fly-y,-300px) rotate(var(--fly-r,720deg)) scale(0.1);opacity:0;} }
        @keyframes dashboardReveal { 0%{opacity:0;transform:scale(1.1);filter:brightness(3) blur(10px);} 30%{opacity:1;filter:brightness(1.5) blur(2px);} 100%{opacity:1;transform:scale(1);filter:brightness(1) blur(0);} }

        .login-panel { animation: panelReveal 1.2s cubic-bezier(0.34,1.56,0.64,1) forwards; opacity:0; }
        .login-panel.visible { opacity:1; }

        /* ===== CYBER INPUT (LOGIN) ===== */
        .cyber-input-field {
            background: rgba(0,10,30,0.7);
            border: 1px solid rgba(0,255,255,0.2);
            color: #e0f8ff;
            outline: none;
            padding: 14px 18px;
            border-radius: 12px;
            width: 100%;
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            font-size: 14px;
            transition: border-color 0.3s, box-shadow 0.3s;
            animation: neonBorderPulse 3s infinite;
            box-sizing: border-box;
            -webkit-appearance: none;
        }
        .cyber-input-field:focus { border-color:rgba(0,255,255,0.8)!important; box-shadow:0 0 30px rgba(0,255,255,0.3),inset 0 0 15px rgba(0,255,255,0.05)!important; }
        .cyber-input-field::placeholder { color:rgba(100,200,255,0.3); }

        /* ===== ENERGY BUTTON ===== */
        .energy-btn {
            position:relative; overflow:hidden;
            background: linear-gradient(90deg,#0ff,#7b2fff,#ff00aa,#0ff);
            background-size:300% 100%;
            border:none; border-radius:12px;
            color:#000; font-weight:900; font-size:15px;
            padding:15px 30px; width:100%;
            cursor:pointer;
            font-family:'Vazirmatn',Tahoma,sans-serif;
            transition: box-shadow 0.3s;
            letter-spacing:0.5px;
            touch-action: manipulation;
            -webkit-appearance: none;
        }
        .energy-btn:hover { animation:btnCharge 1s linear infinite; box-shadow:0 0 40px rgba(0,255,255,0.7),0 0 80px rgba(180,0,255,0.4); }
        .energy-btn::before { content:''; position:absolute; top:0;left:-100%; width:60%; height:100%; background:linear-gradient(90deg,transparent,rgba(255,255,255,0.6),transparent); }
        .energy-btn:hover::before { animation:energyWave 0.8s ease-in-out infinite; }
        .energy-btn:active { transform: scale(0.97); }

        .login-glass-overlay { position:fixed; inset:0; z-index:9998; pointer-events:none; }
        .login-dashboard-overlay { position:fixed; inset:0; z-index:9997; background:#0a0a1a; opacity:0; pointer-events:none; }

        /* ===== AURORA / TYPEWRITER ===== */
        @keyframes typewriterBlink { 0%,100%{opacity:1;} 50%{opacity:0;} }
        .typewriter-cursor { animation: typewriterBlink 0.8s infinite; }

        /* ===== GLITCH TEXT ===== */
        @keyframes glitch1 { 0%,100%{clip-path:inset(0 0 95% 0);transform:translate(-3px,0);} 20%{clip-path:inset(30% 0 50% 0);transform:translate(3px,0);} 40%{clip-path:inset(60% 0 20% 0);transform:translate(-2px,0);} 60%{clip-path:inset(80% 0 5% 0);transform:translate(2px,0);} 80%{clip-path:inset(10% 0 75% 0);transform:translate(0px,0);} }
        @keyframes glitch2 { 0%,100%{clip-path:inset(50% 0 30% 0);transform:translate(2px,0);} 25%{clip-path:inset(10% 0 70% 0);transform:translate(-3px,0);} 50%{clip-path:inset(70% 0 10% 0);transform:translate(3px,0);} 75%{clip-path:inset(20% 0 60% 0);transform:translate(-2px,0);} }
        .glitch-text { position: relative; }
        .glitch-text::before,.glitch-text::after { content: attr(data-text); position:absolute; inset:0; }
        .glitch-text::before { color:#0ff; animation:glitch1 4s infinite steps(1); }
        .glitch-text::after { color:#ff00aa; animation:glitch2 3s infinite steps(1); }

        /* ===== FLOATING PARTICLES (mouse trail) ===== */
        .particle-trail { position:fixed; pointer-events:none; z-index:9998; border-radius:50%; }

        /* ===== RESPONSIVE DASHBOARD ===== */
        @media (max-width: 768px) {
            .dashboard-header { flex-direction: column !important; gap: 12px !important; }
            .dashboard-header-actions { width: 100%; justify-content: stretch; }
            .dashboard-header-actions button { flex: 1; font-size: 12px !important; padding: 8px 10px !important; }
            .tab-bar { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
            .tab-bar::-webkit-scrollbar { display: none; }
            .tab-bar button { white-space: nowrap; flex-shrink: 0; font-size: 12px !important; padding: 10px 14px !important; }
            .stat-grid { grid-template-columns: 1fr 1fr !important; }
            .modal-inner { padding: 16px !important; }
            .sig-grid { grid-template-columns: 1fr !important; }

            // File Upload
            const uploadFileToStorage = async (file) => {

            // Creating Request

            const handleFixSpelling = () => {

                setNewDesc(fixed);

            const handleCreateRequest = async (e) => {

                            const jYear = parseInt(parts[0]);
                            const jMonth = parseInt(parts[1]);
                            const jDay = parseInt(parts[2]);
                            let gYear, gMonth, gDay;
                            if (jMonth > 9) {
                                gYear = jYear + 621;
                                gMonth = jMonth - 9;
                                gDay = jDay;
                            } else {
                                gYear = jYear + 622;
                                gMonth = jMonth + 3;

                    }

            const handleDeleteRequest = async (req) => {

            const handleRejectRequest = async (reqId) => {
                if (!confirm('آیا از رد کردن این درخواست اطمینان دارید؟')) return;
                if (!currentUser) return;

                setLoading(true);
                try {
                    await safeUpdateRequest(reqId, { status: 'rejected' });

                    if (selectedRequest && selectedRequest.reqId === reqId) {

                }
            };

            const handleReverseReject = async (reqId) => {
                if (!currentUser) return;
                setLoading(true);
                try {
                    await safeUpdateRequest(reqId, { status: 'pending' });
                    showToast('درخواست مجدداً به جریان افتاد.', 'success');
                    fetchData();
                } catch (err) {
                    console.error(err);
                    showToast('خطا در فعال‌سازی مجدد درخواست: ' + (err.message || JSON.stringify(err)), 'error');
                } finally {
                    setLoading(false);
                }
            };

            // Canvas Handlers
            const initCanvas = () => {
                const canvas = canvasRef.current;
                if (!canvas) return;

                const ctx = canvas.getContext('2d');
                if (!ctx) return;

                const rect = canvas.getBoundingClientRect();
                canvas.width = rect.width * devicePixelRatio;
                canvas.height = rect.height * devicePixelRatio;
                ctx.scale(devicePixelRatio, devicePixelRatio);
                
                ctx.lineWidth = 3.5;
                ctx.strokeStyle = '#1e293b';
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
            };

            useEffect(() => {
                if (selectedRequest) {
                    const hasSigned = selectedRequest.signatures.some(s => s.signer === currentUser?.username);
                    const isPending = selectedRequest.status === 'pending';
                    const isSigner = currentUser?.role === 'signer';
                    
                    if (isSigner && isPending && !hasSigned) {
                        setTimeout(initCanvas, 100);
                    }
                }
            }, [selectedRequest, currentUser]);

            const getCanvasMousePos = (e) => {
                const canvas = canvasRef.current;
                if (!canvas) return { x: 0, y: 0 };
                const rect = canvas.getBoundingClientRect();
                
                let clientX, clientY;
                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }
                
                return {
                    x: (clientX - rect.left) * (canvas.width / (rect.width * devicePixelRatio)),
                    y: (clientY - rect.top) * (canvas.height / (rect.height * devicePixelRatio))
                };
            };

            const startDrawing = (e) => {
                e.preventDefault();
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                if (!ctx) return;

                const pos = getCanvasMousePos(e);
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
                setIsDrawing(true);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                if (!ctx) return;

                const pos = getCanvasMousePos(e);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            };

            const stopDrawing = () => {
                setIsDrawing(false);
            };

            const clearCanvas = () => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                if (!ctx) return;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            };

            const handleSubmitSignature = async () => {
                const canvas = canvasRef.current;
                if (!canvas || !selectedRequest || !currentUser) return;
                
                const ctx = canvas.getContext('2d');
                if (!ctx) return;

                const buffer = ctx.getImageData(0, 0, canvas.width, canvas.height);
                let isEmpty = true;
                for (let i = 0; i < buffer.data.length; i += 4) {
                    if (buffer.data[i + 3] > 0) {
                        isEmpty = false;
                        break;
                    }
                }

                if (isEmpty) {
                    showToast('لطفاً ابتدا روی بوم امضا را ترسیم کنید.', 'warning');
                    return;
                }

                const dataUrl = canvas.toDataURL('image/png');
                setLoading(true);

                try {
                    const updatedSignatures = [...(selectedRequest.signatures || [])];
                    updatedSignatures.push({
                        signer: currentUser.username,
                        displayName: currentUser.displayName || currentUser.username,
                        time: new Date().toISOString(),
                        dataUrl
                    });

                    const hasKhaaneh = updatedSignatures.some(s => signerRoles.khaaneh === s.signer);
                    const hasRaees = updatedSignatures.some(s => signerRoles.raees === s.signer);
                    const hasNaeb = updatedSignatures.some(s => signerRoles.naeb === s.signer);

                    let newStatus = selectedRequest.status;
                    if (hasKhaaneh && hasRaees && hasNaeb && updatedSignatures.length >= 3) {
                        newStatus = 'approved';
                    }

                    const updatedEvents = [...(selectedRequest.events || [])];
                    updatedEvents.push({
                        time: new Date().toISOString(),
                        action: `امضا توسط ${currentUser.displayName || currentUser.username} (${getRoleLabel(currentUser.username)})`
                    });

                    if (newStatus === 'approved') {
                        updatedEvents.push({
                            time: new Date().toISOString(),
                            action: 'تأیید نهایی درخواست به دلیل تکمیل ترکیب امضاها'
                        });
                    }

                    await safeUpdateRequest(selectedRequest.reqId, {
                        signatures: updatedSignatures,
                        status: newStatus,
                        events: updatedEvents
                    });

                    showToast(
                        newStatus === 'approved' 
                            ? 'درخواست به دلیل تکمیل امضاها با موفقیت تأیید نهایی شد!' 
                            : 'امضای شما با موفقیت ثبت گردید.', 
                        'success'
                    );
                    if (newStatus === 'approved' && typeof window.spawnConfetti === 'function') window.spawnConfetti();

                    const updatedReq = {
                        ...selectedRequest,
                        signatures: updatedSignatures,
                        status: newStatus,
                        events: updatedEvents
                    };
                    setSelectedRequest(updatedReq);
                    fetchData();
                } catch (err) {
                    console.error(err);
                    showToast('خطا در ثبت امضا: ' + (err.message || JSON.stringify(err)), 'error');
                } finally {
                    setLoading(false);
                }
            };

            // Number to Words Converter
            const numberToPersianWords = (num) => {
                if (num === 0) return 'صفر';
                
                const yekan = ['', 'یک', 'دو', 'سه', 'چهار', 'پنج', 'شش', 'هفت', 'هشت', 'نه'];
                const dahgan = ['', 'ده', 'بیست', 'سی', 'چهل', 'پنجاه', 'شصت', 'هفتاد', 'هشتاد', 'نود'];
                const dah_ta_nuzdah = ['ده', 'یازده', 'دوازده', 'سیزده', 'چهارده', 'پانزده', 'شانزده', 'هفده', 'هجده', 'نوزده'];
                const sadgan = ['', 'صد', 'doyest', 'سیصد', 'چهارصد', 'پانصد', 'ششصد', 'هفتصد', 'هشتصد', 'نهصد'];
                const tables = ['', 'هزار', 'میلیون', 'میلیارد', 'تریلیون'];
                
                const convertThreeDigits = (n) => {
                    if (n === 0) return '';
                    let res = [];
                    
                    const s = Math.floor(n / 100);
                    const d = Math.floor((n % 100) / 10);
                    const y = n % 10;
                    
                    if (s > 0) {
                        if (s === 2) res.push('دویست');
                        else res.push(sadgan[s]);
                    }
                    
                    if (d === 1) {
                        res.push(dah_ta_nuzdah[y]);
                    } else {
                        if (d > 0) res.push(dahgan[d]);
                        if (y > 0) res.push(yekan[y]);
                    }
                    
                    return res.join(' و ');
                };
                
                let parts = [];
                let temp = num;
                let unitIdx = 0;
                
                while (temp > 0) {
                    const chunk = temp % 1000;
                    if (chunk > 0) {
                        const chunkStr = convertThreeDigits(chunk);
                        const unit = tables[unitIdx];
                        parts.unshift(chunkStr + (unit ? ' ' + unit : ''));
                    }
                    temp = Math.floor(temp / 1000);
                    unitIdx++;
                }
                
                return parts.join(' و ') + ' تومان';
            };

            // PDF Generation helpers
            const textToCanvasURL = (text, fontSize, color = '#1e293b', maxWidth) => {
                const c = document.createElement('canvas');
                const ctx2 = c.getContext('2d');
                if (!ctx2) return { dataUrl: '', width: 100, height: 10 };
                
                ctx2.font = `${fontSize}px Vazirmatn, Tahoma, sans-serif`;
                const metrics = ctx2.measureText(text);
                const padding = 20;
                const width = Math.min(metrics.width + padding, maxWidth || 1000);
                const height = fontSize * 1.8;
                
                c.width = width * 2;
                c.height = height * 2;
                
                ctx2.scale(2, 2);
                ctx2.font = `${fontSize}px Vazirmatn, Tahoma, sans-serif`;
                ctx2.fillStyle = color;
                ctx2.textAlign = 'right';
                ctx2.textBaseline = 'middle';
                ctx2.fillText(text, width - 10, height / 2);
                
                return {
                    dataUrl: c.toDataURL('image/png'),
                    width: width,
                    height: height
                };
            };

            const textLinesToCanvasURL = (text, fontSize, color = '#334155', maxWidth = 600) => {
                const c = document.createElement('canvas');
                const ctx2 = c.getContext('2d');
                if (!ctx2) return { dataUrl: '', width: maxWidth, height: 20 };
                
                ctx2.font = `${fontSize}px Vazirmatn, Tahoma, sans-serif`;
                
                const lines = [];
                const words = text.split(' ');
                const maxLineWidth = maxWidth - 20;
                let currentLine = '';
                
                for (let word of words) {
                    const testLine = currentLine ? currentLine + ' ' + word : word;
                    if (ctx2.measureText(testLine).width > maxLineWidth && currentLine) {
                        lines.push(currentLine);
                        currentLine = word;
                    } else {
                        currentLine = testLine;
                    }
                }
                if (currentLine) lines.push(currentLine);
                
                const lineHeight = fontSize * 1.6;
                const height = lineHeight * lines.length + 15;
                
                c.width = maxWidth * 2;
                c.height = height * 2;
                
                ctx2.scale(2, 2);
                ctx2.font = `${fontSize}px Vazirmatn, Tahoma, sans-serif`;
                ctx2.fillStyle = color;
                ctx2.textAlign = 'right';
                
                lines.forEach((line, i) => {
                    ctx2.fillText(line, maxWidth - 10, (i + 0.8) * lineHeight);
                });
                
                return {
                    dataUrl: c.toDataURL('image/png'),
                    width: maxWidth,
                    height: height
                };
            };

            const buildPDFDoc = async (req) => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
                const pageW = 210;
                const pageH = 297;
                const margin = 18;

                // === WHITE BACKGROUND ===
                doc.setFillColor(255, 255, 255);
                doc.rect(0, 0, pageW, pageH, 'F');

                // === OUTER BORDER (like the scanned letter) ===
                doc.setDrawColor(80, 80, 80);
                doc.setLineWidth(0.8);
                doc.rect(margin - 4, 10, pageW - (margin - 4) * 2, pageH - 20);

                // === HEADER: بسمه تعالی ===
                const besmObj = textToCanvasURL('بسمه تعالی', 13, '#1a1a1a', 300);
                const besmW = 35; const besmH = (besmObj.height / besmObj.width) * besmW;
                doc.addImage(besmObj.dataUrl, 'PNG', pageW/2 - besmW/2, 14, besmW, besmH);

                // === تاریخ و شماره در گوشه راست بالا ===
                const now = new Date();
                const persianDate = new Intl.DateTimeFormat('fa-IR', {
                    year: 'numeric', month: '2-digit', day: '2-digit',
                    timeZone: 'Asia/Tehran'
                }).format(now);

                const dateLineObj = textToCanvasURL(`تاریخ: ${persianDate}`, 10, '#333', 300);
                const dlW = 45; const dlH = (dateLineObj.height / dateLineObj.width) * dlW;
                doc.addImage(dateLineObj.dataUrl, 'PNG', pageW - margin - dlW - 2, 22, dlW, dlH);

                const trackObj = textToCanvasURL(`شماره: ${req.reqId.slice(-6)}`, 10, '#333', 300);
                const tW = 45; const tH = (trackObj.height / trackObj.width) * tW;
                doc.addImage(trackObj.dataUrl, 'PNG', pageW - margin - tW - 2, 22 + dlH + 1, tW, tH);

                // === خط جداکننده زیر هدر ===
                doc.setDrawColor(100, 100, 100);
                doc.setLineWidth(0.4);
                doc.line(margin - 4, 36, pageW - margin + 4, 36);

                // === با سلام ===
                let curY = 48;
                const salamObj = textToCanvasURL('با سلام', 14, '#111', 300);
                const salamW = 30; const salamH = (salamObj.height / salamObj.width) * salamW;
                doc.addImage(salamObj.dataUrl, 'PNG', pageW - margin - salamW, curY, salamW, salamH);
                curY += salamH + 10;

                // === عنوان درخواست ===
                const titleLineText = `موضوع: ${req.title}`;
                const titleLineObj = textToCanvasURL(titleLineText, 13, '#0f172a', 600);
                const tlW = pageW - margin * 2 - 6;
                const tlH = (titleLineObj.height / titleLineObj.width) * tlW;
                doc.addImage(titleLineObj.dataUrl, 'PNG', margin + 2, curY, tlW, tlH);
                curY += tlH + 4;

                // === مبلغ ===
                const amountText = `مبلغ: ${Number(req.amount).toLocaleString()} تومان  (${numberToPersianWords(req.amount)})`;
                const amountObj = textToCanvasURL(amountText, 12, '#0f766e', 700);
                const aW = pageW - margin * 2 - 6;
                const aH = (amountObj.height / amountObj.width) * aW;
                doc.addImage(amountObj.dataUrl, 'PNG', margin + 2, curY, aW, aH);
                curY += aH + 8;

                // === متن اصلی حواله ===
                const bodyText = req.description && req.description.trim()
                    ? req.description.replace(/__FILE_ATTACHMENT__:.*/s, '').trim()
                    : 'توضیحات درخواست ثبت نشده است.';

                const bodyObj = textLinesToCanvasURL(bodyText, 12, '#1e293b', (pageW - margin * 2 - 6) * 3.78);
                const bW = pageW - margin * 2 - 6;
                const bH = (bodyObj.height / bodyObj.width) * bW;
                doc.addImage(bodyObj.dataUrl, 'PNG', margin + 2, curY, bW, bH);
                curY += bH + 8;

                // === مهلت (اگر داشت) ===
                if (req.expiryDateShamsi) {
                    const expObj = textToCanvasURL(`مهلت اعتبار: ${req.expiryDateShamsi}`, 11, '#92400e', 500);
                    const eW = 80; const eH = (expObj.height / expObj.width) * eW;
                    doc.addImage(expObj.dataUrl, 'PNG', pageW - margin - eW - 2, curY, eW, eH);
                    curY += eH + 6;
                }

                // === خط جداکننده بالای امضاها ===
                curY = Math.max(curY + 10, 200);
                doc.setDrawColor(150, 150, 150);
                doc.setLineWidth(0.3);
                doc.line(margin - 4, curY, pageW - margin + 4, curY);
                curY += 6;

                // === بخش ۳ امضا — مثل عکس: ۳ ستون ===
                const loadImageToPDF = (url) => new Promise((resolve) => {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.onload = () => resolve(img);
                    img.onerror = () => resolve(img);
                    img.src = url;
                });

                const raeesSig   = req.signatures.find(s => signerRoles.raees   === s.signer);
                const khaanehSig = req.signatures.find(s => signerRoles.khaaneh === s.signer);
                const naebSig    = req.signatures.find(s => signerRoles.naeb    === s.signer);

                // --- ۳ ستون: راست = خزانه‌دار، وسط = نائب رئیس، چپ = رئیس ---
                const colW = (pageW - margin * 2) / 3;
                const sigBoxH = 50;

                const sigSlots = [
                    {
                        title: users.find(u => u.username === signerRoles.khaaneh)?.displayName || signerRoles.khaaneh,
                        role: 'خزانه دار هیئت مدیره',
                        sig: khaanehSig,
                        col: 2   // راست
                    },
                    {
                        title: users.find(u => u.username === signerRoles.naeb)?.displayName || signerRoles.naeb,
                        role: 'نائب رئیس هیئت مدیره',
                        sig: naebSig,
                        col: 1   // وسط
                    },
                    {
                        title: users.find(u => u.username === signerRoles.raees)?.displayName || signerRoles.raees,
                        role: 'رئیس هیئت مدیره',
                        sig: raeesSig,
                        col: 0   // چپ
                    },
                ];

                for (const slot of sigSlots) {
                    const colX = margin + slot.col * colW;
                    const centerX = colX + colW / 2;

                    // نام شخص
                    const nameObj = textToCanvasURL(slot.title, 11, '#111', 300);
                    const nW = colW - 4; const nH = (nameObj.height / nameObj.width) * nW;
                    doc.addImage(nameObj.dataUrl, 'PNG', colX + 2, curY, nW, nH);

                    // نقش
                    const roleObj = textToCanvasURL(slot.role, 10, '#555', 300);
                    const rW2 = colW - 4; const rH2 = (roleObj.height / roleObj.width) * rW2;
                    doc.addImage(roleObj.dataUrl, 'PNG', colX + 2, curY + nH + 1, rW2, rH2);

                    // کادر امضا
                    const boxY = curY + nH + rH2 + 4;
                    doc.setFillColor(252, 252, 252);
                    doc.setDrawColor(160, 160, 160);
                    doc.setLineWidth(0.3);
                    doc.rect(colX + 2, boxY, colW - 6, sigBoxH, 'FD');

                    if (slot.sig && slot.sig.dataUrl) {
                        try {
                            const img = await loadImageToPDF(slot.sig.dataUrl);
                            if (img && img.width > 0) {
                                doc.addImage(img, 'PNG', colX + 4, boxY + 3, colW - 10, sigBoxH - 10);
                            }
                        } catch(e) { console.error(e); }

                        // تاریخ امضا
                        const signDate = new Intl.DateTimeFormat('fa-IR', {
                            year: 'numeric', month: '2-digit', day: '2-digit'
                        }).format(new Date(slot.sig.time));
                        const dObj = textToCanvasURL(signDate, 8, '#059669', 200);
                        const dW = colW - 8; const dH2 = (dObj.height / dObj.width) * dW;
                        doc.addImage(dObj.dataUrl, 'PNG', colX + 3, boxY + sigBoxH + 1, dW, dH2);
                    } else {
                        const wObj = textToCanvasURL('در انتظار امضا', 9, '#94a3b8', 200);
                        const wW = colW - 10; const wH = (wObj.height / wObj.width) * wW;
                        doc.addImage(wObj.dataUrl, 'PNG', colX + 3, boxY + sigBoxH/2 - wH/2, wW, wH);
                    }
                }

                // === footer ===
                const footerY = pageH - 14;
                doc.setDrawColor(180, 180, 180);
                doc.setLineWidth(0.3);
                doc.line(margin - 4, footerY - 4, pageW - margin + 4, footerY - 4);
                const footObj = textToCanvasURL('سامانه هوشمند مدیریت خزانه ساختمان', 8, '#94a3b8', 500);
                const fW = 90; const fH = (footObj.height / footObj.width) * fW;
                doc.addImage(footObj.dataUrl, 'PNG', pageW/2 - fW/2, footerY - 2, fW, fH);

                return doc;
            };


            const handleDownloadPDF = async (req) => {
                const hasKhaaneh = req.signatures.some(s => signerRoles.khaaneh === s.signer);
                const hasRaees = req.signatures.some(s => signerRoles.raees === s.signer);
                const hasNaeb = req.signatures.some(s => signerRoles.naeb === s.signer);

                if (!hasKhaaneh || !hasRaees || !hasNaeb) {
                    showToast('❌ هر ۳ امضا (خزانه‌دار، رئیس و نائب رئیس) برای دانلود حواله الزامی است.', 'error');
                    return;
                }

                showToast('در حال آماده‌سازی و ساخت فایل PDF...', 'info');
                try {
                    const doc = await buildPDFDoc(req);
                    doc.save(`حواله-خزانه-${req.title}-${req.reqId}.pdf`);
                    showToast('فایل PDF با موفقیت دانلود شد.', 'success');
                } catch (err) {
                    console.error(err);
                    showToast('خطا در تولید فایل PDF.', 'error');
                }
            };

            const handlePreviewPDF = async (req) => {
                showToast('در حال ایجاد پیش‌نمایش PDF...', 'info');
                try {
                    const doc = await buildPDFDoc(req);
                    const pdfBlob = doc.output('blob');
                    const blobUrl = URL.createObjectURL(pdfBlob);
                    window.open(blobUrl, '_blank');
                    showToast('پیش‌نمایش PDF در زبانه جدید باز شد.', 'success');
                } catch (err) {
                    console.error(err);
                    showToast('خطا در بارگذاری پیش‌نمایش PDF.', 'error');
                }
            };

            // Budget statistics
            const getApprovedTotal = () => {
                return requests
                    .filter(r => r.status === 'approved')
                    .reduce((sum, r) => sum + r.amount, 0);
            };

            const getApprovedAverage = () => {
                const approved = requests.filter(r => r.status === 'approved');
                if (approved.length === 0) return 0;
                return Math.round(getApprovedTotal() / approved.length);
            };

            const getSignatureStatusDetails = (req) => {
                const hasKhaaneh = req.signatures.some(s => signerRoles.khaaneh === s.signer);
                const hasRaees = req.signatures.some(s => signerRoles.raees === s.signer);
                const hasNaeb = req.signatures.some(s => signerRoles.naeb === s.signer);

                const needed = [];
                if (!hasKhaaneh) needed.push('خزانه‌دار (اجباری)');
                if (!hasRaees) needed.push('رئیس هیئت مدیره (اجباری)');
                if (!hasNaeb) needed.push('نائب رئیس (اجباری)');

                return {
                    isValid: hasKhaaneh && hasRaees && hasNaeb,
                    needed: needed.join(' و ')
                };
            };

            // ===================== JSX RENDERING =====================
            if (showPreloader) {
                return (
                    <div className="fixed inset-0 bg-[#040310] z-[99999] flex flex-col items-center justify-center p-6 select-none">
                        {/* Glowing radial ambient lights in preloader */}
                        <div className="absolute w-[300px] h-[300px] rounded-full bg-indigo-500/20 filter blur-[100px]"></div>
                        <div className="absolute w-[250px] h-[250px] rounded-full bg-purple-500/20 filter blur-[90px] translate-x-12 translate-y-12"></div>
                        
                        <div className="relative flex items-center justify-center h-52 w-52 mb-10">
                            {/* Concentric spinning rings with neon glows */}
                            <div className="absolute inset-0 rounded-full border-4 border-dashed border-indigo-500/20 animate-spin-slow shadow-[0_0_20px_rgba(99,102,241,0.1)]"></div>
                            <div className="absolute inset-2 rounded-full border-4 border-indigo-400/5 border-t-indigo-400/80 animate-spin shadow-[0_0_30px_rgba(99,102,241,0.2)]"></div>
                            <div className="absolute inset-4 rounded-full border-4 border-purple-500/5 border-b-purple-500/80 animate-spin-reverse shadow-[0_0_30px_rgba(168,85,247,0.2)]"></div>
                            <div className="absolute inset-6 rounded-full border border-cyan-500/10 border-l-cyan-400 animate-spin-slow"></div>
                            
                            {/* Central glowing icon */}
                            <div className="h-28 w-28 rounded-3xl bg-gradient-to-br from-indigo-500 to-purple-600 flex flex-col items-center justify-center shadow-[0_0_60px_rgba(99,102,241,0.6)] border border-indigo-400/30 animate-pulse-logo z-10">
                                <span className="text-5xl">🏦</span>
                            </div>
                        </div>
                        
                        {/* Interactive Loading and Percentage */}
                        <div className="text-center space-y-4 z-10 max-w-md">
                            <h2 className="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-300 via-purple-300 to-indigo-300 tracking-wide drop-shadow-lg">
                                سامانه هوشمند خزانه ساختمان
                            </h2>
                            
                            {/* Loading Bar and Percentage */}
                            <div className="space-y-2">
                                <div className="flex items-center justify-between text-[11px] text-slate-500 font-bold px-2">
                                    <span>برقراری اتصال ایمن...</span>
                                    <span className="font-mono text-indigo-400 text-sm">{progress}%</span>
                                </div>
                                <div className="h-1.5 w-64 bg-slate-950/80 rounded-full overflow-hidden p-0.5 border border-slate-800/60">
                                    <div className="h-full bg-gradient-to-r from-indigo-500 via-purple-500 to-cyan-400 rounded-full transition-all duration-150 shadow-[0_0_10px_rgba(99,102,241,0.7)]" style={{ width: `${progress}%` }}></div>
                                </div>
                            </div>
                            
                            <p className="text-[10px] text-slate-600 font-medium tracking-wide flex items-center gap-1.5 justify-center">
                                <span className="h-1.5 w-1.5 rounded-full bg-emerald-500 animate-ping"></span>
                                {progress < 30 ? 'در حال برقراری اتصال با سرورهای Supabase...' : 
                                 progress < 60 ? 'در حال رمزگذاری نشست‌ها و کدهای امنیتی...' : 
                                 progress < 85 ? 'بارگذاری بوم دیجیتال و قلم امضای بیومتریک...' : 
                                 'تکمیل فرآیند ایمن‌سازی. آماده ورود به سامانه.'}
                            </p>
                        </div>
                    </div>
                );
            }

            // ===================== FUTURISTIC LOGIN PAGE =====================
            if (!currentUser) {
                return <FuturisticLogin onLogin={handleLogin} loginUsername={loginUsername} setLoginUsername={setLoginUsername} loginPassword={loginPassword} setLoginPassword={setLoginPassword} loginError={loginError} loading={loading} />;
            }

            return (
                <div className="min-h-screen font-sans transition-all duration-300 bg-animated-mesh" style={{overflowX:'hidden',maxWidth:'100vw',position:'relative'}}>
                    
                    {/* Glowing background blobs for ambient premium look */}
                    <div className="absolute top-10 left-10 w-[300px] h-[300px] rounded-full bg-indigo-600/30 blob-glowing-indigo pointer-events-none z-0" style={{maxWidth:'50vw',maxHeight:'50vw'}}></div>
                    <div className="absolute bottom-10 right-10 w-[300px] h-[300px] rounded-full bg-purple-600/30 blob-glowing-purple pointer-events-none z-0" style={{maxWidth:'50vw',maxHeight:'50vw'}}></div>

                    {/* Toast notifications */}
                    <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[9999] flex flex-col gap-2 w-full max-w-sm px-3">
                        {toasts.map(toast => (
                            <div 
                                key={toast.id} 
                                className={`relative flex items-center gap-3 px-4 py-3 rounded-2xl shadow-2xl backdrop-blur-md border animate-zoom-in-spring overflow-hidden ${
                                    toast.type === 'success' 
                                        ? 'bg-emerald-500/10 border-emerald-500/20 text-emerald-400' 
                                        : toast.type === 'error'
                                        ? 'bg-rose-500/10 border-rose-500/20 text-rose-400'
                                        : toast.type === 'warning'
                                        ? 'bg-amber-500/10 border-amber-500/20 text-amber-400'
                                        : 'bg-indigo-500/10 border-indigo-500/20 text-indigo-400'
                                }`}
                            >
                                <span className="text-sm font-medium leading-relaxed">{toast.message}</span>
                                <div className={`absolute bottom-0 left-0 h-0.5 toast-progress ${
                                    toast.type === 'success' ? 'bg-emerald-500' : toast.type === 'error' ? 'bg-rose-500' : toast.type === 'warning' ? 'bg-amber-500' : 'bg-indigo-500'
                                }`} style={{'--toast-duration': '3s'}} />
                            </div>
                        ))}
                    </div>

                    {/* Floating Theme Button */}
                    <div className="fixed top-5 left-5 z-[999]">
                        <button 
                            onClick={toggleTheme}
                            className={`h-11 w-11 rounded-full flex items-center justify-center cursor-pointer border shadow-lg transition-all hover:scale-110 active:scale-95 ${
                                theme === 'dark' 
                                    ? 'bg-[#14192d]/80 border-slate-700/60 text-amber-400 shadow-lg shadow-amber-500/5' 
                                    : 'bg-white/90 border-slate-200 text-indigo-600 shadow-lg shadow-indigo-500/5'
                            }`}
                        >
                            {theme === 'dark' ? '☀️' : '🌙'}
                        </button>
                    </div>

                        <div className="max-w-6xl mx-auto px-4 py-8 animate-fade-in-up z-10 relative">
                            <header className={`p-5 rounded-3xl border mb-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 shadow-xl backdrop-blur-md transition-all duration-300 hover:shadow-indigo-500/5 dashboard-header stagger-1 ${
                                theme === 'dark' ? 'bg-[#14192d]/70 border-slate-800/80 text-white' : 'bg-white/90 border-slate-200 text-slate-800'
                            }`}>
                                <div className="flex items-center gap-4">
                                    <div className="h-14 w-14 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-500 text-xl">
                                        👤
                                    </div>
                                    <div>
                                        <h2 className="text-lg font-extrabold">{currentUser.displayName || currentUser.username}</h2>
                                        <div className="flex items-center gap-2 mt-1">
                                            <span className="text-[11px] px-2 py-0.5 rounded-full font-bold uppercase bg-indigo-500/15 text-indigo-400 border border-indigo-500/20">
                                                {currentUser.role === 'admin' ? 'مدیر کل (Admin)' : currentUser.role === 'requester' ? 'ثبت‌کننده (Requester)' : `امضاکننده: ${getRoleLabel(currentUser.username)}`}
                                            </span>
                                            {dbLoading && <span className="text-xs text-slate-400 animate-pulse">در حال بروزرسانی...</span>}
                                        </div>
                                    </div>
                                </div>

                                <div className="flex items-center gap-2 flex-wrap dashboard-header-actions w-full sm:w-auto">
                                    <button 
                                        onClick={openProfileModal}
                                        className={`px-4 py-2.5 rounded-2xl text-sm font-semibold border transition-all ${
                                            theme === 'dark' ? 'bg-slate-900/40 border-slate-800 text-slate-300' : 'bg-slate-50 border-slate-200 text-slate-600'
                                        }`}
                                    >
                                        ✏️ ویرایش مشخصات
                                    </button>
                                    <button 
                                        onClick={handleLogout}
                                        className="px-4 py-2.5 rounded-2xl text-sm font-semibold bg-rose-500/10 border border-rose-500/20 text-rose-400"
                                    >
                                        🚪 خروج
                                    </button>
                                </div>
                            </header>

                            {/* ADMIN PANEL */}
                            {currentUser.role === 'admin' && (
                                <div>
                                    <div className="flex border-b border-slate-800/40 mb-6 tab-bar pb-0 gap-1 overflow-x-auto -mx-1 px-1">
                                        <button 
                                            onClick={() => setActiveTab('requests')}
                                            className={`px-6 py-3 rounded-t-2xl font-bold text-sm border-b-2 ${
                                                activeTab === 'requests' ? 'border-indigo-500 text-indigo-400 bg-indigo-500/5' : 'border-transparent text-slate-400'
                                            }`}
                                        >
                                            📋 درخواست‌ها ({requests.length})
                                        </button>
                                        <button 
                                            onClick={() => setActiveTab('users')}
                                            className={`px-6 py-3 rounded-t-2xl font-bold text-sm border-b-2 ${
                                                activeTab === 'users' ? 'border-indigo-500 text-indigo-400 bg-indigo-500/5' : 'border-transparent text-slate-400'
                                            }`}
                                        >
                                            👥 کاربران ({users.length})
                                        </button>
                                        <button 
                                            onClick={() => setActiveTab('roles')}
                                            className={`px-6 py-3 rounded-t-2xl font-bold text-sm border-b-2 ${
                                                activeTab === 'roles' ? 'border-indigo-500 text-indigo-400 bg-indigo-500/5' : 'border-transparent text-slate-400'
                                            }`}
                                        >
                                            ⚙️ نقش‌های امضا
                                        </button>
                                        <button 
                                            onClick={() => setActiveTab('prediction')}
                                            className={`px-6 py-3 rounded-t-2xl font-bold text-sm border-b-2 ${
                                                activeTab === 'prediction' ? 'border-indigo-500 text-indigo-400 bg-indigo-500/5' : 'border-transparent text-slate-400'
                                            }`}
                                        >
                                            📊 آمار و بودجه
                                        </button>
                                    </div>

                                    {activeTab === 'requests' && (
                                        <div className={`p-6 rounded-3xl border shadow-lg ${theme === 'dark' ? 'bg-[#14192d]/85 border-slate-800/80' : 'bg-white border-slate-200'}`}>
                                            <h3 className="text-base font-bold mb-4">📋 لیست کل درخواست‌های برداشت</h3>
                                            <RequestsList 
                                                requests={requests} 
                                                theme={theme} 
                                                onOpenDetail={setSelectedRequest} 
                                                onDelete={handleDeleteRequest} 
                                                onReject={handleRejectRequest}
                                                isAdmin={true}
                                                getSignatureStatusDetails={getSignatureStatusDetails}
                                            />
                                        </div>
                                    )}

                                    {activeTab === 'users' && (
                                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                            <div className={`p-6 rounded-3xl border shadow-lg h-fit ${theme === 'dark' ? 'bg-[#14192d]/85 border-slate-800/80' : 'bg-white border-slate-200'}`}>
                                                <h3 className="text-base font-bold mb-4">➕ افزودن کاربر جدید</h3>
                                                <form onSubmit={handleAddUser} className="space-y-4">
                                                    <div>
                                                        <label className="block text-xs font-semibold mb-1.5">نام کاربری</label>
                                                        <input 
                                                            type="text" 
                                                            value={addUname}
                                                            onChange={e => setAddUname(e.target.value)}
                                                            className={`w-full px-4 py-2.5 rounded-xl border text-sm outline-none ${
                                                                theme === 'dark' ? 'bg-slate-950 border-slate-800 text-white' : 'bg-slate-50 border-slate-200 text-slate-800'
                                                            }`}
                                                        />
                                                    </div>
                                                    <div>
                                                        <label className="block text-xs font-semibold mb-1.5">نام نمایشی (فارسی)</label>
                                                        <input 
                                                            type="text" 
                                                            value={addDname}
                                                            onChange={e => setAddDname(e.target.value)}
                                                            className={`w-full px-4 py-2.5 rounded-xl border text-sm outline-none ${
                                                                theme === 'dark' ? 'bg-slate-950 border-slate-800 text-white' : 'bg-slate-50 border-slate-200 text-slate-800'
                                                            }`}
                                                        />
                                                    </div>
                                                    <div>
                                                        <label className="block text-xs font-semibold mb-1.5">رمز عبور</label>
                                                        <input 
                                                            type="text" 
                                                            value={addPass}
                                                            onChange={e => setAddPass(e.target.value)}
                                                            className={`w-full px-4 py-2.5 rounded-xl border text-sm outline-none ${
                                                                theme === 'dark' ? 'bg-slate-950 border-slate-800 text-white' : 'bg-slate-50 border-slate-200 text-slate-800'
                                                            }`}
                                                        />
                                                    </div>
                                                    <div>
                                                        <label className="block text-xs font-semibold mb-1.5">نقش کاربر</label>
                                                        <select 
                                                            value={addRole}
                                                            onChange={e => setAddRole(e.target.value)}
                                                            className={`w-full px-4 py-2.5 rounded-xl border text-sm outline-none ${
                                                                theme === 'dark' ? 'bg-slate-950 border-slate-800 text-white' : 'bg-slate-50 border-slate-200 text-slate-800'
                                                            }`}
                                                        >
                                                            <option value="admin">مدیر سیستم (Admin)</option>
                                                            <option value="requester">ثبت‌کننده درخواست (Requester)</option>
                                                            <option value="signer">امضاکننده مالی (Signer)</option>
                                                            <option value="viewer">فقط مشاهده‌گر (Viewer)</option>
                                                        </select>
                                                    </div>
                                                    <button type="submit" className="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-xl text-sm">➕ ثبت کاربر</button>
                                                </form>
                                            </div>

                                            <div className={`p-6 rounded-3xl border shadow-lg lg:col-span-2 ${theme === 'dark' ? 'bg-[#14192d]/85 border-slate-800/80' : 'bg-white border-slate-200'}`}>
                                                <h3 className="text-base font-bold mb-4">👥 کل کاربران سامانه</h3>
                                                <div className="overflow-x-auto">
                                                    <table className="w-full text-sm text-right">
                                                        <thead>
                                                            <tr className="border-b border-slate-800/60 text-slate-400">
                                                                <th className="py-2.5">نام نمایشی</th>
                                                                <th className="py-2.5">نام کاربری</th>
                                                                <th className="py-2.5">نقش</th>
                                                                <th className="py-2.5 text-left">عملیات</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            {users.map(u => (
                                                                <tr key={u.username} className="border-b border-slate-800/20">
                                                                    <td className="py-3 font-semibold">{u.displayName || u.username}</td>
                                                                    <td className="py-3 font-mono text-slate-400">{u.username}</td>
                                                                    <td className="py-3">
                                                                        <span className="text-xs px-2 py-0.5 rounded bg-indigo-500/10 text-indigo-400">{u.role}</span>
                                                                    </td>
                                                                    <td className="py-3 text-left">
                                                                        <button onClick={() => openEditUserModal(u)} className="text-xs text-indigo-400 hover:underline">ویرایش 🔑</button>
                                                                    </td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {activeTab === 'roles' && (
                                        <div className={`p-6 rounded-3xl border shadow-lg ${theme === 'dark' ? 'bg-[#14192d]/85 border-slate-800/80' : 'bg-white border-slate-200'}`}>
                                            <h3 className="text-base font-bold mb-2">⚙️ تنظیم سمت‌های قانونی امضا</h3>
                                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 my-4">
                                                <div>
                                                    <label className="block text-xs font-bold mb-2">رئیس هیئت مدیره</label>
                                                    <select value={signerRoles.raees} onChange={e => setSignerRoles(prev => ({...prev, raees: e.target.value}))} className="w-full p-2.5 rounded-xl border bg-transparent">
                                                        {users.map(u => <option key={u.username} value={u.username} className="bg-slate-900">{u.displayName || u.username}</option>)}
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-bold mb-2">خزانه‌دار (امضای الزامی)</label>
                                                    <select value={signerRoles.khaaneh} onChange={e => setSignerRoles(prev => ({...prev, khaaneh: e.target.value}))} className="w-full p-2.5 rounded-xl border bg-transparent">
                                                        {users.map(u => <option key={u.username} value={u.username} className="bg-slate-900">{u.displayName || u.username}</option>)}
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-bold mb-2">نائب رئیس</label>
                                                    <select value={signerRoles.naeb} onChange={e => setSignerRoles(prev => ({...prev, naeb: e.target.value}))} className="w-full p-2.5 rounded-xl border bg-transparent">
                                                        {users.map(u => <option key={u.username} value={u.username} className="bg-slate-900">{u.displayName || u.username}</option>)}
                                                    </select>
                                                </div>
                                            </div>
                                            <button onClick={handleSaveSignerRoles} className="bg-indigo-600 text-white px-5 py-2.5 rounded-xl text-sm font-bold mt-2">💾 ذخیره تغییرات</button>
                                        </div>
                                    )}

                                    {activeTab === 'prediction' && (
                                        <div className="space-y-6">
                                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 stat-grid">
                                                <div className={`p-5 rounded-3xl border shadow-lg hover-lift-glow tilt-card stagger-1 ${theme === 'dark' ? 'bg-[#14192d]/85 border-slate-800/80' : 'bg-white border-slate-200'}`}>
                                                    <h4 className="text-xs text-slate-400">💰 کل مبالغ مصوب</h4>
                                                    <p className="text-xl font-bold text-indigo-400 mt-2 number-pop">{getApprovedTotal().toLocaleString()} تومان</p>
                                                    <div className="mt-3 h-1 rounded-full bg-slate-800 overflow-hidden">
                                                        <div className="h-full bg-gradient-to-r from-indigo-500 to-purple-500 rounded-full" style={{width: '70%', animation: 'shimmerSweep 3s infinite'}} />
                                                    </div>
                                                </div>
                                                <div className={`p-5 rounded-3xl border shadow-lg hover-lift-glow tilt-card stagger-2 ${theme === 'dark' ? 'bg-[#14192d]/85 border-slate-800/80' : 'bg-white border-slate-200'}`}>
                                                    <h4 className="text-xs text-slate-400">📊 میانگین هر حواله</h4>
                                                    <p className="text-xl font-bold text-emerald-400 mt-2 number-pop">{getApprovedAverage().toLocaleString()} تومان</p>
                                                    <div className="mt-3 h-1 rounded-full bg-slate-800 overflow-hidden">
                                                        <div className="h-full bg-gradient-to-r from-emerald-500 to-cyan-500 rounded-full" style={{width: '50%'}} />
                                                    </div>
                                                </div>
                                                <div className={`p-5 rounded-3xl border shadow-lg hover-lift-glow tilt-card stagger-3 ${theme === 'dark' ? 'bg-[#14192d]/85 border-slate-800/80' : 'bg-white border-slate-200'}`}>
                                                    <h4 className="text-xs text-slate-400">⏳ درخواست‌های در انتظار</h4>
                                                    <p className="text-xl font-bold text-amber-400 mt-2 number-pop">{requests.filter(r => r.status === 'pending').length} عدد</p>
                                                    <div className="mt-3 h-1 rounded-full bg-slate-800 overflow-hidden">
                                                        <div className="h-full bg-gradient-to-r from-amber-500 to-rose-500 rounded-full" style={{width: `${Math.min(100, requests.filter(r=>r.status==='pending').length * 20)}%`}} />
                                                    </div>
                                                </div>
                                            </div>
                                            {/* Live Status Bar */}
                                            <div className={`p-3 rounded-2xl border overflow-hidden ${theme === 'dark' ? 'bg-[#14192d]/60 border-slate-800/60' : 'bg-white border-slate-200'}`}>
                                                <div className="flex items-center gap-2 text-xs text-slate-500">
                                                    <div className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse flex-shrink-0" />
                                                    <div className="overflow-hidden flex-1">
                                                        <div className="status-bar-inner flex gap-8 text-[10px] font-mono">
