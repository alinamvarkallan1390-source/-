                                                            <span>🔐 اتصال امن برقرار</span>
                                                            <span>💾 دیتابیس آنلاین</span>
                                                            <span>📡 سرویس Supabase فعال</span>
                                                            <span>✅ سیستم پایدار</span>
                                                            <span>🔐 اتصال امن برقرار</span>
                                                            <span>💾 دیتابیس آنلاین</span>
                                                            <span>📡 سرویس Supabase فعال</span>
                                                            <span>✅ سیستم پایدار</span>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* REQUESTER PANEL */}
                            {currentUser.role === 'requester' && (
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                    <div className={`p-6 rounded-3xl border shadow-lg h-fit ${theme === 'dark' ? 'bg-[#14192d]/85 border-slate-800/80' : 'bg-white border-slate-200'}`}>
                                        <h3 className="text-base font-bold mb-4">✍️ ثبت درخواست جدید برداشت</h3>
                                        <form onSubmit={handleCreateRequest} className="space-y-4">
                                            <div>
                                                <label className="block text-xs font-semibold mb-1.5">عنوان حواله</label>
                                                <input type="text" value={newTitle} onChange={e => setNewTitle(e.target.value)} placeholder="مثلاً هزینه تعمیر آسانسور" className="w-full p-2.5 rounded-xl border bg-transparent text-sm"/>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold mb-1.5">مبلغ (تومان)</label>
                                                <input type="number" value={newAmount} onChange={e => setNewAmount(e.target.value)} placeholder="مبلغ به عدد" className="w-full p-2.5 rounded-xl border bg-transparent text-sm"/>
                                                {newAmount && <div className="text-[10px] text-indigo-400 mt-1">✍️ به حروف: {numberToPersianWords(Number(newAmount))}</div>}
                                            </div>
                                            <div>
                                                <div className="flex justify-between mb-1">
                                                    <label className="text-xs font-semibold">توضیحات و فاکتور</label>
                                                    <button type="button" onClick={handleCheckSpelling} className="text-[10px] text-indigo-400">بررسی املای فارسی 🔎</button>
                                                </div>
                                                <textarea rows="3" value={newDesc} onChange={e => setNewDesc(e.target.value)} placeholder="شرح خرید..." className="w-full p-2.5 rounded-xl border bg-transparent text-sm"/>
                                                {spellCheckMsg && (
                                                    <div className="text-xs p-2 rounded bg-indigo-500/10 border mt-1">
                                                        {spellCheckMsg.text}
                                                        {spellCheckMsg.type === 'warning' && <button type="button" onClick={handleFixSpelling} className="block text-[10px] text-amber-400 underline mt-1">اصلاح خودکار حروف عربی</button>}
                                                    </div>
                                                )}
                                            </div>
                                            <div className="grid grid-cols-2 gap-3">
                                                <div>
                                                    <label className="block text-xs font-semibold mb-1">مهلت (شمسی)</label>
                                                    <input type="text" value={newExpiryShamsi} onChange={e => setNewExpiryShamsi(e.target.value)} placeholder="۱۴۰۴/۰۶/۱۵" className="w-full p-2.5 rounded-xl border bg-transparent text-xs text-center"/>
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-semibold mb-1">فایل فاکتور</label>
                                                    <input type="file" onChange={e => setNewFile(e.target.files[0])} className="text-[10px] text-slate-500 w-full mt-2"/>
                                                </div>
                                            </div>
                                            <button type="submit" className="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl text-sm">ثبت و ارسال درخواست</button>
                                        </form>
                                    </div>

                                    <div className={`p-6 rounded-3xl border shadow-lg lg:col-span-2 ${theme === 'dark' ? 'bg-[#14192d]/85 border-slate-800/80' : 'bg-white border-slate-200'}`}>
                                        <h3 className="text-base font-bold mb-4">📋 درخواست‌های ثبت‌شده توسط من</h3>
                                        <RequestsList 
                                            requests={requests.filter(r => r.requester === currentUser.username)} 
                                            theme={theme} 
                                            onOpenDetail={setSelectedRequest} 
                                            onDelete={handleDeleteRequest} 
                                            onReject={handleRejectRequest}
                                            onReverseReject={handleReverseReject}
                                            isAdmin={false}
                                            getSignatureStatusDetails={getSignatureStatusDetails}
                                        />
                                    </div>
                                </div>
                            )}

                            {/* SIGNER PANEL */}
                            {currentUser.role === 'signer' && (
                                <div className="space-y-6">
                                    <div className={`p-6 rounded-3xl border shadow-lg ${theme === 'dark' ? 'bg-[#14192d]/85 border-slate-800/80' : 'bg-white border-slate-200'}`}>
                                        <h3 className="text-base font-bold mb-4 text-amber-400">🖋️ حوالجات در انتظار امضا و تایید شما</h3>
                                        <RequestsList 
                                            requests={requests.filter(r => r.status === 'pending' && !r.signatures.some(s => s.signer === currentUser.username))} 
                                            theme={theme} 
                                            onOpenDetail={setSelectedRequest} 
                                            onDelete={handleDeleteRequest} 
                                            onReject={handleRejectRequest}
                                            isAdmin={false}
                                            getSignatureStatusDetails={getSignatureStatusDetails}
                                        />
                                    </div>

                                    <div className={`p-6 rounded-3xl border shadow-lg ${theme === 'dark' ? 'bg-[#14192d]/85 border-slate-800/80' : 'bg-white border-slate-200'}`}>
                                        <h3 className="text-base font-bold mb-4 text-indigo-400">✅ حوالجاتی که توسط شما امضا شده‌اند</h3>
                                        <RequestsList 
                                            requests={requests.filter(r => r.signatures.some(s => s.signer === currentUser.username))} 
                                            theme={theme} 
                                            onOpenDetail={setSelectedRequest} 
                                            onDelete={handleDeleteRequest} 
                                            onReject={handleRejectRequest}
                                            isAdmin={false}
                                            getSignatureStatusDetails={getSignatureStatusDetails}
                                        />
                                    </div>
                                </div>
                            )}

                            {/* VIEWER PANEL */}
                            {currentUser.role === 'viewer' && (
                                <div className={`p-6 rounded-3xl border shadow-lg ${theme === 'dark' ? 'bg-[#14192d]/85 border-slate-800/80' : 'bg-white border-slate-200'}`}>
                                    <h3 className="text-base font-bold mb-4">👁️ مشاهده تمامی حواله‌های مصوب ساختمان</h3>
                                    <RequestsList 
                                        requests={requests} 
                                        theme={theme} 
                                        onOpenDetail={setSelectedRequest} 
                                        onDelete={handleDeleteRequest} 
                                        onReject={handleRejectRequest}
                                        isAdmin={false}
                                        isViewer={true}
                                        getSignatureStatusDetails={getSignatureStatusDetails}
                                    />
                                </div>
                            )}
                        </div>

                    {/* DETAIL AND SIGNATURE MODAL */}
                    {selectedRequest && (
                        <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-[1000] flex items-end sm:items-center justify-center p-0 sm:p-4 overflow-y-auto transition-all duration-300">
                            <div className={`w-full sm:max-w-2xl rounded-t-3xl sm:rounded-3xl border p-5 sm:p-6 animate-zoom-in-spring shadow-2xl modal-inner ${theme === 'dark' ? 'bg-[#14192d]/95 border-slate-800 text-white' : 'bg-white/95 border-slate-200 text-slate-800'}`}>
                                <div className="flex justify-between items-center mb-4 border-b border-slate-800/20 pb-3">
                                    <div>
                                        <span className="text-[10px] text-slate-500">رهگیری: {selectedRequest.reqId}</span>
                                        <h3 className="text-lg font-black text-indigo-400 mt-0.5">{selectedRequest.title}</h3>
                                    </div>
                                    <button onClick={() => setSelectedRequest(null)} className="text-xl">✖️</button>
                                </div>

                                <div className="space-y-4 max-h-[65vh] overflow-y-auto pr-1">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="p-3.5 rounded-2xl bg-slate-500/5 border border-slate-800/60">
                                            <span className="text-xs text-slate-400 block">مبلغ حواله</span>
                                            <strong className="text-lg text-emerald-400 font-bold">{Number(selectedRequest.amount).toLocaleString()} تومان</strong>
                                            <span className="text-[9px] text-slate-500 block mt-1">حروف: {numberToPersianWords(selectedRequest.amount)}</span>
                                        </div>
                                        <div className="p-3.5 rounded-2xl bg-slate-500/5 border border-slate-800/60">
                                            <span className="text-xs text-slate-400 block">مهلت انقضا</span>
                                            <strong className="text-sm font-bold">{selectedRequest.expiryDateShamsi || 'نامحدود'}</strong>
                                        </div>
                                    </div>

                                    <div>
                                        <span className="text-xs text-slate-400 block mb-1">شرح درخواست</span>
                                        <div className="p-3 rounded-xl bg-slate-500/5 border border-slate-800/30 text-sm leading-relaxed">{selectedRequest.description || 'توضیحی ارائه نشده است.'}</div>
                                    </div>

                                    {selectedRequest.fileUrl && (
                                        <div className="p-3 rounded-xl bg-indigo-500/5 border border-indigo-500/20 flex justify-between items-center">
                                            <span className="text-xs text-slate-300">📄 فایل فاکتور ضمیمه شده</span>
                                            <a href={selectedRequest.fileUrl} target="_blank" rel="noreferrer" className="text-xs bg-indigo-600 text-white px-3 py-1.5 rounded-lg font-bold">📥 مشاهده / دانلود فاکتور</a>
                                        </div>
                                    )}

                                    <div className="space-y-2 pt-2 border-t border-slate-800/20">
                                        <span className="text-xs text-slate-400 block">وضعیت امضاها و تایید نهایی</span>
                                        
                                        <div className={`p-3 rounded-xl border text-sm font-bold ${
                                            selectedRequest.status === 'approved' ? 'bg-emerald-500/10 border-emerald-500/20 text-emerald-400' : 'bg-amber-500/10 border-amber-500/20 text-amber-400'
                                        }`}>
                                            {selectedRequest.status === 'approved' ? '✅ حواله تأیید نهایی شده است (هر ۳ امضا کامل است)' : `⏳ در انتظار تکمیل امضاها (نیاز به: ${getSignatureStatusDetails(selectedRequest).needed})`}
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 sig-grid">
                                            {['khaaneh', 'raees', 'naeb'].map(role => {
                                                const uName = signerRoles[role];
                                                const uObj = users.find(u => u.username === uName);
                                                const label = role === 'khaaneh' ? 'خزانه‌دار (الزامی)' : role === 'raees' ? 'رئیس' : 'نائب رئیس';
                                                const signed = selectedRequest.signatures.find(s => s.signer === uName);

                                                return (
                                                    <div key={role} className={`p-3 rounded-xl border text-center flex flex-col justify-between h-32 ${signed ? 'bg-emerald-500/5 border-emerald-500/20' : 'bg-slate-500/5 border-dashed border-slate-800/30'}`}>
                                                        <div>
                                                            <span className="text-[9px] text-slate-500 block">{label}</span>
                                                            <span className="text-xs font-bold block mt-0.5">{uObj?.displayName || uName}</span>
                                                        </div>
                                                        {signed ? (
                                                            <div className="flex flex-col items-center">
                                                                <img src={signed.dataUrl} className="h-10 object-contain filter invert opacity-90 dark:invert-0 bg-white/5 p-0.5 rounded"/>
                                                                <span className="text-[8px] text-emerald-400 mt-1">{new Date(signed.time).toLocaleDateString('fa-IR')}</span>
                                                            </div>
                                                        ) : <span className="text-[9px] text-slate-500 italic mb-2">در انتظار...</span>}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    {/* PEN SIGNATURE CANVAS */}
                                    {currentUser && currentUser.role === 'signer' && 
                                     selectedRequest.status === 'pending' && 
                                     !selectedRequest.signatures.some(s => s.signer === currentUser.username) && (
                                        <div className="pt-3 border-t border-slate-800/20 space-y-2">
                                            <div className="flex justify-between items-center">
                                                <span className="text-xs text-indigo-400 font-bold">🖊️ بوم امضای دیجیتال شما</span>
                                                <button onClick={clearCanvas} className="text-[10px] text-rose-400">پاک کردن بوم 🧹</button>
                                            </div>
                                            <div className="border border-slate-800 rounded-xl overflow-hidden bg-white">
                                                <canvas 
                                                    ref={canvasRef}
                                                    onMouseDown={startDrawing}
                                                    onMouseMove={draw}
                                                    onMouseUp={stopDrawing}
                                                    onMouseLeave={stopDrawing}
                                                    onTouchStart={startDrawing}
                                                    onTouchMove={draw}
                                                    onTouchEnd={stopDrawing}
                                                    className="w-full h-36 bg-slate-50 cursor-crosshair touch-none"
                                                />
                                            </div>
                                            <button onClick={handleSubmitSignature} className="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-sm">✅ ثبت و تایید امضا</button>
                                        </div>
                                    )}

                                    {/* PDF GENERATION BUTTONS */}
                                    {selectedRequest.signatures.length >= 3 && (
                                        <div className="pt-3 border-t border-slate-800/20 flex items-center justify-between gap-3 flex-wrap">
                                            <span className="text-xs text-slate-400">📄 خروجی رسمی حواله مالی:</span>
                                            <div className="flex gap-2">
                                                <button onClick={() => handlePreviewPDF(selectedRequest)} className="px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-800 border border-slate-700 text-slate-300">👁️ پیش‌نمایش PDF</button>
                                                {getSignatureStatusDetails(selectedRequest).isValid && (
                                                    <button onClick={() => handleDownloadPDF(selectedRequest)} className="px-3.5 py-2 rounded-xl text-xs font-bold bg-indigo-600 text-white">📥 دانلود PDF حواله</button>
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* PROFILE MODAL */}
                    {profileModalOpen && (
                        <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-[1000] flex items-center justify-center p-4 transition-all duration-300">
                            <div className={`w-full max-w-md rounded-3xl border p-6 animate-zoom-in-spring shadow-2xl ${theme === 'dark' ? 'bg-[#14192d]/95 border-slate-800' : 'bg-white/95 border-slate-200 text-slate-800'}`}>
                                <h3 className="text-base font-black mb-4">👤 ویرایش مشخصات فردی</h3>
                                <form onSubmit={handleSaveProfile} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold mb-1">نام کاربری</label>
                                        <input type="text" value={profileUname} onChange={e => setProfileUname(e.target.value)} className="w-full p-2.5 rounded-xl border bg-transparent text-sm"/>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold mb-1">نام نمایشی (فارسی)</label>
                                        <input type="text" value={profileDname} onChange={e => setProfileDname(e.target.value)} className="w-full p-2.5 rounded-xl border bg-transparent text-sm"/>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold mb-1">رمز عبور جدید (اختیاری)</label>
                                        <input type="password" value={profilePass} onChange={e => setProfilePass(e.target.value)} placeholder="خالی بگذارید تا تغییر نکند" className="w-full p-2.5 rounded-xl border bg-transparent text-sm"/>
                                    </div>
                                    <div className="flex gap-3 pt-2">
                                        <button type="button" onClick={() => setProfileModalOpen(false)} className="flex-1 py-2 rounded-xl border text-xs">انصراف</button>
                                        <button type="submit" className="flex-1 bg-indigo-600 text-white font-bold py-2 rounded-xl text-xs">ذخیره تغییرات</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* USER EDIT MODAL */}
                    {userEditModalOpen && userToEdit && (
                        <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-[1000] flex items-center justify-center p-4 transition-all duration-300">
                            <div className={`w-full max-w-md rounded-3xl border p-6 animate-zoom-in-spring shadow-2xl ${theme === 'dark' ? 'bg-[#14192d]/95 border-slate-800' : 'bg-white/95 border-slate-200 text-slate-800'}`}>
                                <h3 className="text-base font-black mb-4">👥 ویرایش کاربر: {userToEdit.username}</h3>
                                <form onSubmit={handleUpdateUser} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold mb-1">نام کاربری</label>
                                        <input type="text" value={editUname} onChange={e => setEditUname(e.target.value)} className="w-full p-2.5 rounded-xl border bg-transparent text-sm"/>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold mb-1">نام نمایشی</label>
                                        <input type="text" value={editDname} onChange={e => setEditDname(e.target.value)} className="w-full p-2.5 rounded-xl border bg-transparent text-sm"/>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold mb-1">رمز عبور جدید</label>
                                        <input type="text" value={editPass} onChange={e => setEditPass(e.target.value)} className="w-full p-2.5 rounded-xl border bg-transparent text-sm"/>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold mb-1">نقش</label>
                                        <select value={editRole} onChange={e => setEditRole(e.target.value)} className="w-full p-2.5 rounded-xl border bg-transparent text-sm">
                                            <option value="admin">مدیر سیستم (Admin)</option>
                                            <option value="requester">ثبت‌کننده (Requester)</option>
                                            <option value="signer">امضاکننده (Signer)</option>
                                            <option value="viewer">مشاهده‌گر (Viewer)</option>
                                        </select>
                                    </div>
                                    <div className="flex gap-3 pt-2">
                                        <button type="button" onClick={() => { setUserEditModalOpen(false); setUserToEdit(null); }} className="flex-1 py-2 rounded-xl border text-xs">انصراف</button>
                                        <button type="submit" className="flex-1 bg-indigo-600 text-white font-bold py-2 rounded-xl text-xs">ذخیره ویرایش</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        // ===================== REQUEST LIST COMPONENT =====================
        function RequestsList({ requests, theme, onOpenDetail, onDelete, onReject, onReverseReject, isAdmin, isViewer = false, getSignatureStatusDetails }) {
            if (requests.length === 0) {
                return (
                    <div className="text-center py-10 text-slate-500 text-sm">
                        هیچ درخواستی در این بخش یافت نشد.
                    </div>
                );
            }

            return (
                <div className="space-y-3">
                    {requests.map((req, idx) => {
                        const locked = req.status === 'approved' || req.status === 'rejected' || req.status === 'expired';
                        
                        return (
                            <div key={req.reqId} className={`p-4 rounded-2xl border flex flex-col sm:flex-row justify-between sm:items-center gap-3 hover-lift-glow req-item tilt-card ${
                                theme === 'dark' ? 'bg-slate-900/30 border-slate-800/40 text-white shadow-lg shadow-black/20' : 'bg-white border-slate-200 text-slate-800 shadow-md'
                            }`} style={{animationDelay: `${idx * 0.05}s`, animation: 'staggerIn 0.5s cubic-bezier(0.16,1,0.3,1) both'}}>
                                <div className="flex-1 min-w-0">
                                    <div className="flex items-center gap-2 flex-wrap">
                                        <strong className="text-sm font-extrabold truncate">{req.title}</strong>
                                        <span className={`text-[9px] px-2 py-0.5 rounded-full font-bold border flex-shrink-0 ${
                                            req.status === 'approved' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' :
                                            req.status === 'rejected' ? 'bg-rose-500/10 text-rose-400 border-rose-500/20' :
                                            'bg-amber-500/10 text-amber-400 border-amber-500/20'
                                        }`}>
                                            {req.status === 'approved' ? 'تأیید نهایی' : req.status === 'rejected' ? 'رد شده' : 'در انتظار امضا'}
                                        </span>
                                    </div>
                                    <div className="text-[10px] text-slate-400 mt-1 flex gap-2 flex-wrap">
                                        <span>💰 {Number(req.amount).toLocaleString()} تومان</span>
                                        <span>✍️ {req.signatures.length}/۳</span>
                                        {req.expiryDateShamsi && <span>📅 {req.expiryDateShamsi}</span>}
                                    </div>
                                </div>

                                <div className="flex gap-2 flex-wrap req-item-actions">
                                    <button onClick={() => onOpenDetail(req)} className="ripple-btn text-xs bg-indigo-600 text-white px-3 py-1.5 rounded-lg font-bold flex-1 sm:flex-none transition-all active:scale-95">مشاهده</button>
                                    {isAdmin && (
                                        <>
                                            {!locked && (
                                                <button onClick={() => onReject(req.reqId)} className="ripple-btn text-xs bg-amber-500/10 text-amber-400 border border-amber-500/20 px-3 py-1.5 rounded-lg font-bold flex-1 sm:flex-none active:scale-95">رد ❌</button>
                                            )}
                                            <button onClick={() => onDelete(req)} className="ripple-btn text-xs bg-rose-500/10 text-rose-400 border border-rose-500/20 px-2 py-1.5 rounded-lg active:scale-95" title="حذف">🗑️</button>
                                        </>
                                    )}
                                    {!isAdmin && !isViewer && req.status === 'rejected' && onReverseReject && (
                                        <button onClick={() => onReverseReject(req.reqId)} className="ripple-btn text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1.5 rounded-lg active:scale-95">🔄</button>
                                    )}
                                </div>
                            </div>
                        );
                    })}
                </div>
            );
        }

        // ===================== FUTURISTIC LOGIN COMPONENT =====================
        function FuturisticLogin({ onLogin, loginUsername, setLoginUsername, loginPassword, setLoginPassword, loginError, loading }) {
            const canvasRef = useRef(null);
            const animFrameRef = useRef(null);
            const particlesRef = useRef([]);
            const mouseRef = useRef({ x: -9999, y: -9999 });
            const energyLevelRef = useRef(0);
            const coreRadiusRef = useRef(0);
            const phaseRef = useRef('idle'); // idle, attracting, charging, cracking, done
            const [panelVisible, setPanelVisible] = useState(false);
            const [btnLabel, setBtnLabel] = useState('ورود به سامانه ←');
            const [inputDelay1] = useState('0.8s');
            const [inputDelay2] = useState('1.1s');
            const glassCanvasRef = useRef(null);
            const overlayRef = useRef(null);
            const dashOverlayRef = useRef(null);
            const containerRef = useRef(null);
            const onLoginRef = useRef(onLogin);
            onLoginRef.current = onLogin;

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                
                const resize = () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                    if (glassCanvasRef.current) {
                        glassCanvasRef.current.width = window.innerWidth;
                        glassCanvasRef.current.height = window.innerHeight;
                    }
                };
                resize();
                window.addEventListener('resize', resize);

                // Create particles
                const count = Math.min(window.innerWidth < 768 ? 600 : 1200, 1200);
                particlesRef.current = Array.from({ length: count }, () => ({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: (Math.random() - 0.5) * 0.4,
                    r: Math.random() * 1.8 + 0.4,
                    hue: Math.random() * 60 + 170, // cyan to blue range
                    alpha: Math.random() * 0.6 + 0.2,
                    attracted: false,
                }));

                // Show panel after brief delay
                setTimeout(() => setPanelVisible(true), 600);

                let frame = 0;
                const animate = () => {
                    animFrameRef.current = requestAnimationFrame(animate);
                    frame++;
                    
                    const W = canvas.width;
                    const H = canvas.height;
                    const cx = W / 2;
                    const cy = H / 2;
                    const phase = phaseRef.current;
                    const energy = energyLevelRef.current;

                    ctx.fillStyle = 'rgba(4,3,16,0.18)';
                    ctx.fillRect(0, 0, W, H);

                    // Core radius grows with energy
                    const targetCoreR = 30 + energy * 200;
                    coreRadiusRef.current += (targetCoreR - coreRadiusRef.current) * 0.04;
                    const cr = coreRadiusRef.current;

                    // Draw core glow rings
                    const ringCount = 4;
                    for (let i = ringCount; i > 0; i--) {
                        const rr = cr * (1 + i * 0.5);
                        const alpha = (0.15 - i * 0.025) * (0.5 + energy * 0.5);
                        const hue = 180 + energy * 120 + Math.sin(frame * 0.02 + i) * 20;
                        ctx.beginPath();
                        ctx.arc(cx, cy, rr, 0, Math.PI * 2);
                        ctx.fillStyle = `hsla(${hue}, 100%, 60%, ${alpha})`;
                        ctx.fill();
                    }

                    // Core itself
                    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, cr * 1.1);
                    const coreHue = 180 + energy * 100;
                    grad.addColorStop(0, `hsla(${coreHue + 30}, 100%, 95%, ${0.9 + energy * 0.1})`);
                    grad.addColorStop(0.3, `hsla(${coreHue}, 100%, 70%, ${0.7 + energy * 0.3})`);
                    grad.addColorStop(0.7, `hsla(${coreHue - 20}, 100%, 50%, ${0.3 + energy * 0.3})`);
                    grad.addColorStop(1, 'transparent');
                    ctx.beginPath();
                    ctx.arc(cx, cy, cr * 1.1, 0, Math.PI * 2);
                    ctx.fillStyle = grad;
                    ctx.fill();

                    // Particles
                    const mx = mouseRef.current.x;
                    const my = mouseRef.current.y;

                    particlesRef.current.forEach(p => {
                        if (phase === 'charging' || phase === 'cracking') {
                            // Attract to core
                            const dx = cx - p.x;
                            const dy = cy - p.y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            const force = Math.min(8, (energy * 5) / Math.max(dist * 0.01, 1));
                            p.vx += (dx / dist) * force * 0.1;
                            p.vy += (dy / dist) * force * 0.1;
                        } else {
                            // Mouse repulsion / attraction
                            const mdx = p.x - mx;
                            const mdy = p.y - my;
                            const mdist = Math.sqrt(mdx * mdx + mdy * mdy);
                            if (mdist < 120) {
                                const mforce = (120 - mdist) / 120;
                                p.vx += (mdx / mdist) * mforce * 2;
                                p.vy += (mdy / mdist) * mforce * 2;
                            }

                            // Gentle drift toward center
                            const dx = cx - p.x;
                            const dy = cy - p.y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist > cr + 20) {
                                p.vx += (dx / dist) * 0.008 * energy;
                                p.vy += (dy / dist) * 0.008 * energy;
                            }
                        }

                        p.vx *= 0.97;
                        p.vy *= 0.97;
                        p.x += p.vx;
                        p.y += p.vy;

                        // Wrap edges
                        if (p.x < 0) p.x = W;
                        if (p.x > W) p.x = 0;
                        if (p.y < 0) p.y = H;
                        if (p.y > H) p.y = 0;

                        const distToCore = Math.sqrt((p.x - cx) ** 2 + (p.y - cy) ** 2);
                        if (distToCore < cr && phase !== 'cracking') return;

                        const pHue = p.hue + energy * 60;
                        const brightness = 0.5 + energy * 0.5;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.r * (1 + energy * 0.5), 0, Math.PI * 2);
                        ctx.fillStyle = `hsla(${pHue}, 100%, ${50 + brightness * 30}%, ${p.alpha * (0.6 + energy * 0.4)})`;
                        ctx.fill();
                    });

                    // Dynamic neon color lines (higher energy)
                    if (energy > 0.1 && frame % 3 === 0) {
                        const lineCount = Math.floor(energy * 8);
                        for (let i = 0; i < lineCount; i++) {
                            const angle = Math.random() * Math.PI * 2;
                            const len = 40 + Math.random() * 150 * energy;
                            const sx = cx + Math.cos(angle) * (cr + 5);
                            const sy = cy + Math.sin(angle) * (cr + 5);
                            const ex = sx + Math.cos(angle) * len;
                            const ey = sy + Math.sin(angle) * len;
                            const lHue = 160 + energy * 120 + Math.random() * 60;
                            ctx.beginPath();
                            ctx.moveTo(sx, sy);
                            ctx.lineTo(ex, ey);
                            ctx.strokeStyle = `hsla(${lHue}, 100%, 70%, ${0.1 + Math.random() * 0.3 * energy})`;
                            ctx.lineWidth = Math.random() * 1.5;
                            ctx.stroke();
                        }
                    }

                    // Increase energy slowly over time
                    if (phase === 'idle' && energy < 0.4) {
                        energyLevelRef.current += 0.0004;
                    }
                };
                animate();

                return () => {
                    window.removeEventListener('resize', resize);
                    if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current);
                };
            }, []);

            // Mouse/Touch tracking
            const handlePointerMove = (e) => {
                const t = e.touches ? e.touches[0] : e;
                mouseRef.current = { x: t.clientX, y: t.clientY };
                if (phaseRef.current === 'idle') {
                    energyLevelRef.current = Math.min(0.5, energyLevelRef.current + 0.002);
                }
            };

            const handleLoginClick = async (e) => {
                if (phaseRef.current !== 'idle') return;
                phaseRef.current = 'charging';
                setBtnLabel('شارژ انرژی...');
                
                // Charge up
                const chargeInterval = setInterval(() => {
                    energyLevelRef.current = Math.min(1, energyLevelRef.current + 0.03);
                    if (energyLevelRef.current >= 0.99) {
                        clearInterval(chargeInterval);
                        triggerCrack();
                    }
                }, 30);

                // Also attempt login in parallel
                if (e && e.preventDefault) e.preventDefault();
                // We'll fire the actual login after crack animation
                setTimeout(async () => {
                    try {
                        await onLoginRef.current(e || { preventDefault: () => {} });
                    } catch (err) {}
                }, 800);
            };

            const triggerCrack = () => {
                phaseRef.current = 'cracking';
                
                // Shake
                if (containerRef.current) {
                    containerRef.current.style.animation = 'screenShake 0.6s ease-in-out';
                }

                // Draw glass crack
                const gc = glassCanvasRef.current;
                if (gc) {
                    gc.style.display = 'block';
                    gc.style.animation = 'glassReveal 2s ease forwards';
                    drawGlassCracks(gc);
                }

                // Fragment explosion after brief freeze
                setTimeout(() => {
                    explodeFragments();
                }, 800);
            };

            const drawGlassCracks = (gc) => {
                const ctx = gc.getContext('2d');
                const W = gc.width;
                const H = gc.height;
                const cx = W / 2;
                const cy = H / 2;

                ctx.clearRect(0, 0, W, H);

                // Glass tint
                ctx.fillStyle = 'rgba(150, 230, 255, 0.08)';
                ctx.fillRect(0, 0, W, H);

                // Draw cracks radiating from center
                const crackCount = 18;
                const drawCrack = (startX, startY, angle, length, depth) => {
                    if (depth <= 0 || length < 15) return;
                    const endX = startX + Math.cos(angle) * length;
                    const endY = startY + Math.sin(angle) * length;

                    ctx.beginPath();
                    ctx.moveTo(startX, startY);
                    
                    // Jagged line
                    const steps = Math.floor(length / 20);
                    for (let i = 1; i <= steps; i++) {
                        const t = i / steps;
                        const jx = startX + (endX - startX) * t + (Math.random() - 0.5) * 8;
                        const jy = startY + (endY - startY) * t + (Math.random() - 0.5) * 8;
                        ctx.lineTo(jx, jy);
                    }
                    ctx.lineTo(endX, endY);
                    
                    ctx.strokeStyle = `rgba(180, 240, 255, ${0.6 * (depth / 4)})`;
                    ctx.lineWidth = depth * 0.7;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = 'rgba(0, 255, 255, 0.5)';
                    ctx.stroke();
                    ctx.shadowBlur = 0;

                    // Branch
                    if (depth > 1) {
                        const branchCount = Math.floor(Math.random() * 3) + 1;
                        for (let i = 0; i < branchCount; i++) {
                            const branchAngle = angle + (Math.random() - 0.5) * 1.2;
                            drawCrack(endX, endY, branchAngle, length * (0.4 + Math.random() * 0.4), depth - 1);
                        }
                    }
                };

                for (let i = 0; i < crackCount; i++) {
                    const angle = (i / crackCount) * Math.PI * 2 + (Math.random() - 0.5) * 0.3;
                    drawCrack(cx, cy, angle, 80 + Math.random() * (Math.max(W, H) * 0.6), 4);
                }
            };

            const explodeFragments = () => {
                const W = window.innerWidth;
                const H = window.innerHeight;
                const container = overlayRef.current;
                if (!container) return;

                container.style.display = 'block';
                
                // Flash
                container.style.background = 'rgba(150,255,255,0.3)';
                setTimeout(() => { container.style.background = 'transparent'; }, 100);

                // Create fragments
                const fragCount = 80;
                for (let i = 0; i < fragCount; i++) {
                    const frag = document.createElement('div');
                    const size = 10 + Math.random() * 60;
                    const startX = W / 2 + (Math.random() - 0.5) * 200;
                    const startY = H / 2 + (Math.random() - 0.5) * 200;
                    const flyX = (Math.random() - 0.5) * W * 2;
                    const flyY = -(Math.random() * H * 1.5 + 100);
                    const rotation = (Math.random() - 0.5) * 1440;
                    const hue = 170 + Math.random() * 80;

                    frag.style.cssText = `
                        position: fixed;
                        left: ${startX}px;
                        top: ${startY}px;
                        width: ${size}px;
                        height: ${size * (0.4 + Math.random() * 0.6)}px;
                        background: linear-gradient(135deg, hsla(${hue},100%,80%,0.8), hsla(${hue+30},100%,60%,0.4));
                        clip-path: polygon(${Math.random()*30}% 0%, ${70+Math.random()*30}% ${Math.random()*20}%, 100% ${30+Math.random()*40}%, ${80+Math.random()*20}% 100%, ${Math.random()*30}% ${80+Math.random()*20}%);
                        --fly-x: translateX(${flyX}px);
                        --fly-y: translateY(${flyY}px);
                        --fly-r: rotate(${rotation}deg);
                        animation: fragmentFly ${0.8 + Math.random() * 0.8}s cubic-bezier(0.25, 0.46, 0.45, 0.94) ${Math.random() * 0.3}s forwards;
                        z-index: 9998;
                        pointer-events: none;
                        box-shadow: 0 0 15px hsla(${hue},100%,70%,0.5);
                        border: 1px solid hsla(${hue},100%,90%,0.3);
                    `;
                    container.appendChild(frag);
                }

                // Reveal dashboard
                if (dashOverlayRef.current) {
                    dashOverlayRef.current.style.animation = 'dashboardReveal 1.5s ease 0.3s forwards';
                }

                setTimeout(() => {
                    phaseRef.current = 'done';
                    if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current);
                }, 2000);
            };

            // Typewriter hook inside login
            const [typeText, setTypeText] = React.useState('');
            const fullText = 'سامانه هوشمند خزانه';
            React.useEffect(() => {
                let i = 0;
                const iv = setInterval(() => {
                    setTypeText(fullText.slice(0, i + 1));
                    i++;
                    if (i >= fullText.length) clearInterval(iv);
                }, 80);
                return () => clearInterval(iv);
            }, []);

            return (
                <div 
                    ref={containerRef}
                    onMouseMove={handlePointerMove}
                    onTouchMove={handlePointerMove}
                    style={{ position: 'fixed', inset: 0, background: '#020210', overflow: 'hidden', zIndex: 10 }}
                >
                    {/* Particle canvas */}
                    <canvas ref={canvasRef} style={{ position: 'fixed', inset: 0, zIndex: 0 }} />

                    {/* Aurora blobs behind panel */}
                    <div style={{ position:'fixed', top:'10%', left:'5%', width:'40vw', height:'40vw', maxWidth:'400px', maxHeight:'400px', borderRadius:'50%', background:'radial-gradient(circle, rgba(99,102,241,0.25), transparent 70%)', filter:'blur(60px)', animation:'auroraShift1 18s infinite ease-in-out', pointerEvents:'none', zIndex:1 }} />
                    <div style={{ position:'fixed', bottom:'10%', right:'5%', width:'35vw', height:'35vw', maxWidth:'350px', maxHeight:'350px', borderRadius:'50%', background:'radial-gradient(circle, rgba(168,85,247,0.2), transparent 70%)', filter:'blur(70px)', animation:'auroraShift2 22s infinite ease-in-out 3s', pointerEvents:'none', zIndex:1 }} />
                    <div style={{ position:'fixed', top:'40%', right:'10%', width:'25vw', height:'25vw', maxWidth:'250px', maxHeight:'250px', borderRadius:'50%', background:'radial-gradient(circle, rgba(6,182,212,0.15), transparent 70%)', filter:'blur(50px)', animation:'auroraShift3 14s infinite ease-in-out 1s', pointerEvents:'none', zIndex:1 }} />

                    {/* Glass crack canvas */}
                    <canvas ref={glassCanvasRef} style={{ position: 'fixed', inset: 0, zIndex: 9996, display: 'none', pointerEvents: 'none' }} />

                    {/* Fragment overlay */}
                    <div ref={overlayRef} style={{ position: 'fixed', inset: 0, zIndex: 9997, display: 'none', pointerEvents: 'none' }} />

                    {/* Dashboard reveal overlay */}
                    <div ref={dashOverlayRef} className="login-dashboard-overlay" />

                    {/* Login Panel */}
                    {panelVisible && (
                        <div className="login-root" style={{ zIndex: 100 }}>
                            <div 
                                className="login-panel login-panel-inner"
                                style={{
                                    background: 'rgba(2, 8, 25, 0.88)',
                                    backdropFilter: 'blur(30px)',
                                    WebkitBackdropFilter: 'blur(30px)',
                                    border: '1px solid rgba(0,255,255,0.12)',
                                    borderRadius: '28px',
                                    padding: 'clamp(22px, 5vw, 44px)',
                                    width: 'min(440px, calc(100vw - 24px))',
                                    maxHeight: 'calc(var(--vh, 1vh) * 92)',
                                    overflowY: 'auto',
                                    boxShadow: '0 0 80px rgba(0,200,255,0.08), 0 0 160px rgba(120,0,255,0.06), inset 0 1px 0 rgba(255,255,255,0.06)',
                                    position: 'relative',
                                    overflow: 'hidden',
                                }}
                            >
                                {/* Scanning line */}
                                <div style={{ position:'absolute', left:0, width:'100%', height:'2px', background:'linear-gradient(90deg, transparent, rgba(0,255,255,0.7), rgba(168,85,247,0.5), transparent)', animation:'scan 5s linear infinite', zIndex:2, pointerEvents:'none' }} />

                                {/* Noise texture overlay */}
                                <div style={{ position:'absolute', inset:0, opacity:0.02, backgroundImage:"url(\"data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E\")", backgroundSize:'120px', pointerEvents:'none', zIndex:1 }} />

                                {/* Corner brackets — animated */}
                                {[
                                    {t:'8px',l:'8px',bw:'2px 0 0 2px'},
                                    {t:'8px',r:'8px',bw:'2px 2px 0 0'},
                                    {b:'8px',l:'8px',bw:'0 0 2px 2px'},
                                    {b:'8px',r:'8px',bw:'0 2px 2px 0'}
                                ].map((pos, i) => (
                                    <div key={i} style={{ position:'absolute', width:'18px', height:'18px', borderStyle:'solid', borderColor:'rgba(0,255,255,0.5)', borderWidth:pos.bw, top:pos.t, left:pos.l, right:pos.r, bottom:pos.b, boxShadow:'0 0 8px rgba(0,255,255,0.3)', transition:'all 0.3s', zIndex:3 }} />
                                ))}

                                {/* Logo area */}
                                <div style={{ textAlign:'center', marginBottom:'28px', position:'relative', zIndex:4 }}>
                                    {/* Radar rings */}
                                    <div style={{ position:'relative', display:'inline-block', marginBottom:'16px' }}>
                                        <div style={{ position:'absolute', inset:'-20px', borderRadius:'50%', border:'1px solid rgba(0,255,255,0.15)', animation:'radarScan 3s infinite linear' }} />
                                        <div style={{ position:'absolute', inset:'-20px', borderRadius:'50%', border:'1px solid rgba(0,255,255,0.1)', animation:'radarScan 3s infinite linear', animationDelay:'1.5s' }} />
                                        <div style={{
                                            display:'inline-flex', alignItems:'center', justifyContent:'center',
                                            width:'76px', height:'76px', borderRadius:'22px',
                                            background:'linear-gradient(135deg, rgba(0,200,255,0.12), rgba(150,0,255,0.12))',
                                            border:'1px solid rgba(0,255,255,0.25)',
                                            boxShadow:'0 0 40px rgba(0,200,255,0.15), inset 0 1px 0 rgba(255,255,255,0.05)',
                                            fontSize:'34px',
                                            animation:'coreBreath 3s ease-in-out infinite',
                                            position:'relative', zIndex:2,
                                        }}>🏦</div>
                                    </div>

                                    {/* Glitch title */}
                                    <div style={{ position:'relative', marginBottom:'8px' }}>
                                        <div 
                                            data-text={typeText}
                                            className="glitch-text"
                                            style={{ 
                                                fontSize:'clamp(16px, 4vw, 22px)', fontWeight:900,
                                                background:'linear-gradient(90deg, #00ffff, #a855f7, #ff00aa)',
                                                WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent',
                                                backgroundClip:'text', display:'inline-block',
                                            }}>
                                            {typeText}<span className="typewriter-cursor" style={{color:'#0ff', WebkitTextFillColor:'#0ff'}}>|</span>
                                        </div>
                                    </div>

                                    <div style={{ fontSize:'10px', color:'rgba(100,200,255,0.45)', letterSpacing:'3px', textTransform:'uppercase', fontFamily:'monospace' }}>
                                        ◈ AI TREASURY SYSTEM ◈
                                    </div>

                                    {/* Heartbeat line */}
                                    <svg viewBox="0 0 200 30" style={{ width:'100%', maxWidth:'200px', marginTop:'12px', opacity:0.5 }} className="heartbeat-line">
                                        <polyline points="0,15 30,15 40,5 50,25 60,15 80,15 90,3 95,27 100,15 120,15 130,10 140,20 150,15 200,15" fill="none" stroke="url(#hbg)" strokeWidth="1.5"/>
                                        <defs><linearGradient id="hbg" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stopColor="transparent"/><stop offset="50%" stopColor="#00ffff"/><stop offset="100%" stopColor="transparent"/></linearGradient></defs>
                                    </svg>
                                </div>

                                {/* Inputs */}
                                <div style={{ display:'flex', flexDirection:'column', gap:'14px', marginBottom:'20px', position:'relative', zIndex:4 }}>
                                    <div>
                                        <label style={{ display:'flex', alignItems:'center', gap:'6px', fontSize:'10px', color:'rgba(0,255,255,0.5)', marginBottom:'8px', fontWeight:700, letterSpacing:'1.5px', textTransform:'uppercase' }}>
                                            <span style={{ width:'6px', height:'6px', borderRadius:'50%', background:'#0ff', boxShadow:'0 0 6px #0ff', display:'inline-block' }} />
                                            IDENTITY CODE
                                        </label>
                                        <input
                                            className="cyber-input-field"
                                            type="text"
                                            value={loginUsername}
                                            onChange={e => setLoginUsername(e.target.value)}
                                            placeholder="نام کاربری خود را وارد کنید"
                                            onFocus={() => { energyLevelRef.current = Math.min(0.6, energyLevelRef.current + 0.05); }}
                                            onKeyDown={e => e.key === 'Enter' && handleLoginClick(e)}
                                            autoComplete="username"
                                        />
                                    </div>
                                    <div>
                                        <label style={{ display:'flex', alignItems:'center', gap:'6px', fontSize:'10px', color:'rgba(168,85,247,0.6)', marginBottom:'8px', fontWeight:700, letterSpacing:'1.5px', textTransform:'uppercase' }}>
                                            <span style={{ width:'6px', height:'6px', borderRadius:'50%', background:'#a855f7', boxShadow:'0 0 6px #a855f7', display:'inline-block' }} />
                                            AUTH SEQUENCE
                                        </label>
                                        <input
                                            className="cyber-input-field"
                                            type="password"
                                            value={loginPassword}
                                            onChange={e => setLoginPassword(e.target.value)}
                                            placeholder="رمز عبور"
                                            onFocus={() => { energyLevelRef.current = Math.min(0.7, energyLevelRef.current + 0.05); }}
                                            onKeyDown={e => e.key === 'Enter' && handleLoginClick(e)}
                                            autoComplete="current-password"
                                        />
                                    </div>
                                </div>

                                {loginError && (
                                    <div className="shake" style={{ padding:'10px 14px', borderRadius:'12px', marginBottom:'14px', background:'rgba(255,50,50,0.08)', border:'1px solid rgba(255,80,80,0.25)', color:'#ff8080', fontSize:'12px', textAlign:'center', zIndex:4, position:'relative' }}>
                                        ⚠️ {loginError}
                                    </div>
                                )}

                                {/* Login Button */}
                                <button
                                    className="energy-btn ripple-btn"
                                    onClick={handleLoginClick}
                                    disabled={loading}
                                    style={{
                                        background: loading ? 'linear-gradient(90deg, #0ff, #7b2fff, #ff00aa, #0ff)' : undefined,
                                        backgroundSize: '300% 100%',
                                        animation: loading ? 'btnCharge 0.8s linear infinite' : undefined,
                                        position:'relative', zIndex:4,
                                    }}
                                >
                                    {loading ? '⚡ در حال احراز هویت...' : btnLabel}
                                </button>

                                {/* Bottom status bar */}
                                <div style={{ marginTop:'18px', padding:'10px 14px', borderRadius:'12px', background:'rgba(0,255,136,0.04)', border:'1px solid rgba(0,255,136,0.08)', position:'relative', zIndex:4, overflow:'hidden' }}>
                                    <div style={{ display:'flex', justifyContent:'center', alignItems:'center', gap:'8px' }}>
                                        <div style={{ width:'7px', height:'7px', borderRadius:'50%', background:'#00ff88', boxShadow:'0 0 10px #00ff88', animation:'pulseLogo 2s infinite', flexShrink:0 }} />
                                        <div style={{ overflow:'hidden', flex:1 }}>
                                            <div className="status-bar-inner" style={{ display:'flex', gap:'24px', fontSize:'9px', color:'rgba(0,255,136,0.5)', letterSpacing:'1px', fontFamily:'monospace', whiteSpace:'nowrap' }}>
                                                <span>SYSTEM ONLINE</span><span>•</span><span>SECURE CONNECTION</span><span>•</span><span>ENCRYPTED</span><span>•</span><span>SYSTEM ONLINE</span><span>•</span><span>SECURE CONNECTION</span><span>•</span><span>ENCRYPTED</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Render React Application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
